name: Probe launchctl (temporary)

# What launchctl really prints on each macOS a runner has, for a refused load. Taken away
# again before the pull request is opened.
on:
  push:
    branches: [fix/macos-refused-service]

permissions:
  contents: read

jobs:
  probe:
    name: launchctl on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    steps:
      - name: Ask launchctl
        shell: bash
        run: |
          set +e
          say() { echo; echo "##### $*"; }
          ran() { echo "\$ $*"; "$@" 2>&1 | head -n 40 | cat -vt; echo "[exit ${PIPESTATUS[0]}]"; }
          U=$(id -u)
          L=dev.it.probe
          P="$HOME/Library/LaunchAgents/$L.plist"
          mkdir -p "$HOME/Library/LaunchAgents"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0">' '<dict>' "<key>Label</key><string>$L</string>" '<key>ProgramArguments</key>' '<array><string>/bin/sleep</string><string>600</string></array>' '<key>RunAtLoad</key><true/>' '</dict>' '</plist>' > "$P"
          chmod 644 "$P"
          say system; sw_vers
          say "print-disabled before anything"
          ran launchctl print-disabled "gui/$U"
          say "loaded, then disabled, then taken out"
          ran launchctl bootstrap "gui/$U" "$P"
          ran launchctl disable "gui/$U/$L"
          ran launchctl bootout "gui/$U/$L"
          sleep 2
          ran launchctl print-disabled "gui/$U"
          ran launchctl bootstrap "gui/$U" "$P"
          say "enabled again"
          ran launchctl enable "gui/$U/$L"
          ran launchctl print-disabled "gui/$U"
          ran launchctl print "gui/$U/$L"
          say "print-disabled of the user domain and of the system"
          ran launchctl print-disabled "user/$U"
          launchctl print-disabled system 2>&1 | head -n 6 | cat -vt
          launchctl print-disabled system 2>&1 | tail -n 12 | cat -vt
          rm -f "$P"
          exit 0
