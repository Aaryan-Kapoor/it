name: Safari

# Safari itself, which the other workflows cannot run: Playwright's WebKit is the engine Safari is
# built on, and not Safari. On one of GitHub's Macs, the Safari that comes with it and the Safari
# of an iPhone in Xcode's iOS Simulator are each paired with a test It, shown a page, and made to
# press its button, through safaridriver (e2e/safari.mjs). The action is to be accepted and held
# by It.
#
# It is run every night and when asked for, and blocks nothing: the simulator takes from one to
# four minutes to boot, and safaridriver does not always find its Safari at the first ask, which
# the check allows for and says. No job is given a secret, and none signs in to anything.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24

jobs:
  safari:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Safari on macOS
            simulator: false
          - name: Safari on the iOS Simulator
            simulator: true
    steps:
      - name: Where this run keeps things
        run: |
          echo "IT_HOME=$RUNNER_TEMP/it-home" >> "$GITHUB_ENV"
          echo "IT_PORT=4700" >> "$GITHUB_ENV"
          echo "IT_STACK_LOGS=$RUNNER_TEMP/it-logs" >> "$GITHUB_ENV"
          sw_vers
          echo "Safari on the Mac $(defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build the Node bundle, and use it
        run: |
          npm run generate
          echo "IT_CLI=$GITHUB_WORKSPACE/packages/cli/dist/it.mjs" >> "$GITHUB_ENV"
      # As the end-to-end job of it.yml starts it: the stack goes on running behind the steps
      # that follow, and what it ends with is written down beside its process id
      - name: Start It
        id: stack
        run: |
          mkdir -p "$IT_STACK_LOGS"
          nohup bash -c 'node e2e/stack.mjs & echo $! > "$RUNNER_TEMP/it-stack.pid"; wait $!; echo $? > "$RUNNER_TEMP/it-stack.ended"' > "$IT_STACK_LOGS/stack.log" 2>&1 &
          node e2e/ready.mjs 300
      # The newest iOS the runner has, on the first iPhone it offers for it
      - name: Boot an iPhone in the simulator
        if: matrix.simulator
        timeout-minutes: 8
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | node -e '
            const all = JSON.parse(require("fs").readFileSync(0, "utf8")).devices
            const ios = Object.keys(all).filter((k) => k.includes(".iOS-")).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }))
            for (const k of ios) {
              const phone = all[k].find((d) => d.name.startsWith("iPhone"))
              if (phone) { console.error(`${k}: ${phone.name}`); console.log(phone.udid); break }
            }')"
          [ -n "$udid" ] || { echo "::error::the runner offers no iPhone in its simulators"; exit 1; }
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          start=$(date +%s)
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          echo "::notice::the simulator booted in $(( $(date +%s) - start )) s"
      - name: Enable safaridriver and start it
        run: |
          sudo safaridriver --enable
          nohup safaridriver -p 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4444/status > /dev/null && exit 0; sleep 1; done
          echo "::error::safaridriver did not answer"; exit 1
      - name: Safari pairs, shows a page, and a press of its button reaches It
        run: node e2e/safari.mjs --out "$RUNNER_TEMP/screens" ${SIMULATOR:+--simulator "$SIMULATOR"}
      - name: Stop It
        if: always() && steps.stack.outcome != 'skipped'
        working-directory: ${{ runner.temp }}
        run: |
          [ -f it-stack.pid ] && kill "$(cat it-stack.pid)" 2>/dev/null || true
          for _ in $(seq 1 300); do [ -s it-stack.ended ] && break; sleep 1; done
          [ -s it-stack.ended ] || { echo "::error::The stack had not ended 300 seconds after it was asked to stop"; exit 1; }
          ended="$(cat it-stack.ended)"
          [ "$ended" = 0 ] || { echo "::error::The stack ended with $ended"; exit 1; }
      # Only what the browser showed once it was paired, and nothing It wrote down: It's log is
      # not read for credentials here, so it is not kept
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: safari-${{ matrix.simulator && 'ios-simulator' || 'macos' }}
          path: ${{ runner.temp }}/screens/
          retention-days: 7
          if-no-files-found: ignore
