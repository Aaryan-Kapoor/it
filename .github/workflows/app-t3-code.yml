name: T3 Code, the real server

# What this proves, with the real T3 Code and no account anywhere (e2e/apps/t3-code.mjs). T3 Code
# is installed from its official package (`t3` on npm, whose launcher fetches T3 Code's own
# program) on a fresh runner: the version npm marks latest, and the nightly, which is what T3
# Code's own desktop app and its owner's machine run ahead of a release. Its server is started
# with `t3 serve` in a throwaway T3 Code folder. Then:
#
#   - It's own code for T3 Code (packages/cli/src/t3.ts) finds the server from the note T3 Code
#     keeps, finds T3 Code's own program where T3 Code's launcher keeps it, is issued a session by
#     T3 Code's own command, and lists and reads threads in version 2 of T3 Code's protocol, which
#     the real server is asked whether it still speaks. A thread made with T3 Code's own command
#     for Claude Code is found by the conversation id T3 Code hands Claude Code. Asked in a
#     version the server does not speak, It takes the refusal for not knowing, never for no thread;
#   - a whole It, with the real Claude Code connected by `it setup`, says through `it create`
#     and `it status` that what the person does in that conversation arrives through the thread,
#     and a click on the page in a real browser lands in that thread, and no other, as a message
#     from the person that T3 Code takes up as a turn; with It's add-on turned off by Claude
#     Code's own command, a click still lands there.
#
# The turn T3 Code starts fails, since Claude Code has no account here: what is checked is that T3
# Code took the message for the right thread. It runs on Linux. The script also runs on Windows,
# where It finds T3 Code's command where T3 Code's launcher keeps it, and passed there; it is left
# out of this matrix because It's own setup and service take minutes each on a Windows runner, and
# the job then runs past the time it is given.
#
# It runs on every pull request, on every push to master, once a night and by hand. It is a
# workflow of its own and blocks no merge: a T3 Code published tomorrow that It no longer reaches
# turns the nightly run red, which is what it is for. Every action is pinned to a commit, the
# checkout keeps no credentials, the token can only read, and no job is given a secret.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request, or to master, replaces the run of the push before it, as in
# "It on macOS and Windows": every push to master queues jobs on GitHub's few Macs, and merges in
# a row would otherwise hold the main workflow's own Mac jobs behind them for hours. A push never
# cancels a nightly run or one started by hand, which have groups of their own: one of those that
# is going is left to finish, and of those waiting behind it only the newest is kept, as GitHub
# does in every group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24

jobs:
  t3-code:
    name: T3 Code ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: [latest, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The Node bundle, with everything it carries: the add-on that setup installs among it
      - run: npm run generate
      - name: Install the browser that clicks the page's button
        # Fetching a browser fails on a runner now and then, before anything of It has run: it is tried three times
        run: for n in 1 2 3; do npx playwright install --with-deps chromium && exit 0; sleep 20; done; exit 1
      # T3 Code and Claude Code are installed from npm by the script itself, into folders of the
      # run's own, and run with a home and a T3 Code folder of the run's own
      - name: It's way to a thread, against the real T3 Code server
        timeout-minutes: 8
        env:
          IT_T3_ROOT: ${{ runner.temp }}
          IT_PORT: 6300
        run: node e2e/apps/t3-code.mjs --version ${{ matrix.version }}
