      var k = spot(t, t, [[b.x + b.w + 24, cy - t * 0.6], [cx - t / 2, b.y + b.h + 14], [b.x - t - 24, cy - t * 0.6], [cx - t / 2, b.y - t - 14]], used, F);
      steps.push(line("board-tick", tick(k, t), 400));
      used.push(k);
      var r = t * 0.3, s = spot(r * 2, r * 2, [[k.x + t + 12, k.y + t * 0.1], [k.x + t * 0.25, k.y + t + 8], [k.x - r * 2 - 12, k.y + t * 0.1], [k.x + t * 0.25, k.y - r * 2 - 8]], used, F);
      steps.push(line("board-star", star(s.x + r, s.y + r, r, rnd), 680));
      used.push(s);
      near = [[s.x + r * 2 + 20, s.y + r - size * 0.5], [b.x, Math.max(b.y + b.h, k.y + t, s.y + r * 2) + 14]];
      low = Math.max(b.y + b.h, k.y + t, s.y + r * 2);
    } else {
      var rx = Math.max(50, b.w / 2 + 26), ry = Math.max(42, b.h / 2 + 20), answer = Shell.tidy(got.answer, 8);
      steps.push(line("board-ring", ring(cx, cy, rx, ry, rnd), 760));
      used.push({ x: cx - rx - 6, y: cy - ry - 6, w: rx * 2 + 12, h: ry * 2 + 12 });
      low = cy + ry;
      if (answer) {
        var as = clamp(b.h, 58, L.sum[2]), aw = wide(answer, as), ah = as * 0.78, gap = 74;
        // Beside the ring, or after the sum where that is free, as it is on a tall board, or under the ring, before it, or over it
        var a = spot(aw, ah, [[cx + rx + gap, cy - ah / 2], [sum.x + sum.w + 20, sum.y + (sum.h - ah) / 2], [cx - aw / 2, cy + ry + gap * 0.72], [cx - rx - gap - aw, cy - ah / 2], [cx - aw / 2, cy - ry - gap * 0.72 - ah]], used, F);
        steps = steps.concat(arrow(cx, cy, rx, ry, a));
        steps.push(words("board-right", answer, a.x, a.y + ah * 0.94, as));
        used.push(a);
        low = Math.max(low, a.y + ah);
      }
    }
    if (hint) {
      // Under everything, at the left of what is written, and smaller where the board has no room for it as large as that
      for (var small = 1, lines, h; small > 0.6; small -= 0.16) {
        size = L.write * small;
        lines = wrap(hint, size, Math.min(L.w, F.w));
        var hw = Math.max.apply(null, lines.map((text) => wide(text, size))), hh = lines.length * size * 1.04;
        h = spot(hw, hh, near.concat([[-sx, Math.max(L.hint - sy - size * 0.8, low + 16)], [-sx, low + 16], [b.x, low + 16], [-sx, F.y + F.h - hh], [cx + 60, low + 16]]), used, F);
        if (h.free) break;
      }
      lines.forEach((text, i) => steps.push(words(i ? "" : "board-hint", text, h.x, h.y + size * 0.8 + i * size * 1.04, size)));
    }
    perform(steps);
  }
  var asker = my.asker((got) => {
    clean();
    busy = false;
    // An agent that cannot look at pictures says so, and marks nothing: its sentence is shown, the board is left as the
    // person wrote it, and from then on they may type their answer under it. Once it has said so, the state goes on
    // saying so under its later answers, so an answer to something typed that says whether it is right is a marking
    if (got.blind === true && !(last.typed && typeof got.right === "boolean")) {
      typeRow.hidden = false;
      my.line("Type your answer under the board, and press Check it. {agent} marks what you typed.");
    } else marked(got);
    box.say(got.say);
    ready();
  }, () => { busy = false; ready(); });
  checkBtn.addEventListener("click", () => {
    if (busy || !has()) return;
    var began = Date.now();
    busy = true;
    clean();
    ready();
    box.sending(began);
    // A typed answer goes as it is, with no picture: the agent marks it as it would one it had read
    last = { typed: !!typed, was: my.answers() };
    if (typed) {
      box.did("typed an answer");
      asker.send("checked", { answer: ANSWER, typed: typed, saved: null, question: QUESTION, sum: SUM, working: WORKING, png: null, strokes: [] }, began);
      return;
    }
    var R = region();
    mine.forEach((s) => { s.points = s.u.map((p) => [(p[0] - R.x) / R.w, (p[1] - R.y) / R.h]); });
    picture(R).then((png) => {
      var data = fitted(png);
      // Sent as it is, it would be refused, and again each time: so the person is told what would let it go
      if (!data) {
        busy = false;
        ready();
        box.idle();
        box.did("");
        box.hint("That is too many lines to send at once. Clear the board, and write it again.");
        return;
      }
      box.did("wrote an answer");
      // The picture is what the agent reads, and It has it written to a file for the agent before it hears of this, under
      // a name that this request gives it: `saved` is that name, in the folder the agent works in. The lines go only
      // where there is no picture to read. What the agent needs first is first: the right answer, and where the picture is
      var request = Shell.newId();
      asker.send("checked", { answer: ANSWER, saved: data.png ? ".it-tour-" + request + ".png" : null, question: QUESTION, sum: SUM, working: WORKING, png: data.png, strokes: data.png ? [] : data.strokes }, began, request);
    });
  });
  my.onEnter(() => {
    layout();
    if (kept) { var steps = kept; kept = null; perform(steps); }
  });
  // Marks that are on their way when the person leaves are all there when they come back
  my.onLeave(() => {
    inHand(false);
    if (!playing) return;
    var steps = playing;
    marking++;
    playing = null;
    rest();
    steps.forEach(shown);
  });
  if (typeof ResizeObserver === "function") new ResizeObserver(layout).observe(face);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (typed) typedShown(); }).catch(() => {});
  theirPen.title = my.agent + " marks with the green marker";
  pick("blue");
  layout();
  ready();
  box.idle();
  box.did("");
  box.hint("Pick a marker from the tray, write your answer on the board, and press Check it.");
});
</script>
