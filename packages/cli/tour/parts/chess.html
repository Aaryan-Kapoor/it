<style>

  [data-part="chess"] .chess-table { --gap: 24px; --side: clamp(168px, calc((100cqw - 100cqh) / 2 - 24px), 288px); --b: min(100cqh, calc(100cqw - 2 * var(--side) - 2 * var(--gap)));
    display: grid; grid-template: "black board sheet" 1fr "white board sheet" auto / var(--side) var(--b) var(--side); column-gap: var(--gap); height: var(--b); min-width: 0; }
  /* One square is 1em of the board, so that everything on it is cut to its size */
  [data-part="chess"] .chess-board { grid-area: board; position: relative; width: var(--b); height: var(--b); display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: 12px; overflow: hidden; container-type: inline-size; line-height: 1; -webkit-user-select: none; user-select: none; touch-action: manipulation; will-change: transform; transition: opacity .3s; box-shadow: 0 18px 40px -26px rgba(28, 26, 22, .55); }
  [data-part="chess"] .sq { position: relative; min-width: 0; min-height: 0; margin: 0; padding: 0; border: 0; border-radius: 0; -webkit-appearance: none; appearance: none; font-size: 12.5cqi; cursor: default; background: var(--sq); color: var(--sq-dark); }

  /* The squares the agent's move left and reached are framed in the agent's colour as well */
  [data-part="chess"] .sq.last.theirs { box-shadow: inset 0 0 0 .05em var(--green); }
  [data-part="chess"] .sq.check { background: var(--clay); color: #fff; }
  [data-part="chess"] .sq.can { cursor: pointer; }
  @media (hover: hover) { [data-part="chess"] .sq.can:hover { box-shadow: inset 0 0 0 .05em rgba(14, 14, 16, .25); } }
  [data-part="chess"] .sq.pick, [data-part="chess"] .sq.pick:hover { box-shadow: inset 0 0 0 .065em var(--ink); }
  [data-part="chess"] .sq:focus-visible { outline: 0; box-shadow: inset 0 0 0 .065em var(--green); }
  [data-part="chess"] .sq.to::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; margin: -15% 0 0 -15%; border-radius: 50%; background: rgba(14, 14, 16, .26); pointer-events: none; }
  [data-part="chess"] .sq.to.cap::after { width: 90%; height: 90%; margin: -45% 0 0 -45%; background: none; box-shadow: inset 0 0 0 .075em rgba(14, 14, 16, .34); }
  [data-part="chess"] .co { position: absolute; font-size: max(9px, .17em); font-weight: 700; font-style: normal; line-height: 1; pointer-events: none; }
  [data-part="chess"] .co.r { left: 6%; top: 6%; } [data-part="chess"] .co.f { right: 7%; bottom: 5%; }
  /* A piece is a drawing of its square, a hundred units a side, with its figure's outline in the middle. The edge of a white piece is 6 of those units, in the outline's own thousandths */
  [data-part="chess"] .pc { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  [data-part="chess"] .pc path { fill: #1c1a16; }
  [data-part="chess"] .pc.w path { fill: #fffdf8; stroke: #1c1a16; stroke-width: 73; stroke-linejoin: round; paint-order: stroke fill; }
  [data-part="chess"] .pc.fly { inset: auto; width: 12.5%; height: 12.5%; z-index: 3; }
  [data-part="chess"] .pc.fly.heavy { filter: drop-shadow(0 .6cqi .5cqi rgba(28, 26, 22, .4)); }
  [data-part="chess"] .chess-arrow { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; pointer-events: none; }
  [data-part="chess"][data-wait="1"] .chess-board { opacity: .94; }
  /* The two who play */
  [data-part="chess"] .chess-seat { min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px 10px; align-content: start; }
  [data-part="chess"] #chess-black { grid-area: black; } [data-part="chess"] #chess-white { grid-area: white; align-content: end; }
  [data-part="chess"] .chess-disc { width: 16px; height: 16px; border-radius: 50%; background: #1c1a16; box-shadow: 0 0 0 2px var(--line); } [data-part="chess"] #chess-white .chess-disc { background: #fffdf8; box-shadow: 0 0 0 2px var(--faint); }

  [data-part="chess"] .chess-turn { grid-column: 2; justify-self: start; display: inline-flex; align-items: center; gap: 7px; font: 600 12px/1 Text; color: var(--green); visibility: hidden; }
  [data-part="chess"] .chess-turn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  [data-part="chess"] .chess-seat.said .chess-turn { visibility: visible; }

  @keyframes chess-beat { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent); } to { box-shadow: 0 0 0 8px transparent; } }
  /* What each has taken, and by how much it is ahead */
  [data-part="chess"] .chess-taken { grid-column: 1 / -1; min-height: 24px; display: flex; align-items: center; flex-wrap: wrap; }
  [data-part="chess"] .chess-taken .pc { position: static; flex: none; width: 26px; height: 26px; margin-right: -9px; }

      if (kind === "p" && (file === 3 || file === 4) && to <= 5 && to >= 3) s += to === 4 ? 0.4 : 0.25;
      if (m.flag === "short" || m.flag === "long") s += 0.6;
      if (kind === "k" && !m.flag) s -= 0.4;
      if (kind === "q" && after.full < 8) s -= 0.2;
      if (kind === "n" && (file === 0 || file === 7)) s -= 0.2;
      return { m: m, s: s, i: i };
    });
    scored.sort((a, b) => b.s - a.s || a.i - b.i);
    return scored.slice(0, 4).map((x) => C.uci(x.m));
  }

  function figure(p) {
    var el = document.createElementNS(NS, "svg"), shape = document.createElementNS(NS, "path"), f = FIGURE[C.kind(p)];
    el.setAttribute("class", "pc " + C.side(p));
    el.setAttribute("viewBox", "0 0 100 100");
    el.setAttribute("aria-hidden", "true");
    el.setAttribute("data-piece", p);
    // An outline is drawn with its heights going up, and a square's go down
    shape.setAttribute("transform", "translate(" + (50 - (FIGURE_SIZE * (f.box[0] + f.box[2])) / 2) + " " + (50 + (FIGURE_SIZE * (f.box[1] + f.box[3])) / 2) + ") scale(" + FIGURE_SIZE + " " + -FIGURE_SIZE + ")");
    shape.setAttribute("d", f.d);
    el.appendChild(shape);
    return el;
  }
  function square(s) {
    var el = document.createElement("button"), f = s & 7, r = s >> 3;
    el.type = "button";
    el.setAttribute("data-sq", C.name(s));
    el.tabIndex = s === home ? 0 : -1;
    var mark = (cls, text) => {
      var i = document.createElement("i");
      i.className = "co " + cls;
      i.setAttribute("aria-hidden", "true");
      i.textContent = text;
      el.appendChild(i);
    };
    if (f === 0) mark("r", String(r + 1));
    if (r === 0) mark("f", "abcdefgh".charAt(f));
    el.addEventListener("click", () => tap(s));
    // One square of the board is in the order of the tab key, and the arrows go from it to the others
    el.addEventListener("focus", () => {
      cells[home].tabIndex = -1;
      home = s;
      el.tabIndex = 0;
    });
    cells[s] = el;
    shown[s] = "";
    figures[s] = null;
    return el;
  }
  for (var row = 7; row >= 0; row--) for (var file = 0; file < 8; file++) boardEl.insertBefore(square(row * 8 + file), arrowEl);
  boardEl.addEventListener("keydown", (e) => {
    var step = { ArrowUp: 8, ArrowDown: -8, ArrowLeft: -1, ArrowRight: 1 }[e.key], at = cells.indexOf(document.activeElement);
    if (!step || at < 0) return;
    e.preventDefault();
    var to = at + step;
    if (to >= 0 && to < 64 && (step === 8 || step === -8 || (to >> 3) === (at >> 3))) cells[to].focus();
  });

  // A move as a sheet writes it: `Nf3`, `exd5`, `O-O`, with `+` for check and `#` for mate. `legal` is what could be played where it was made
  function written(m, legal, after) {
    var kind = C.kind(m.piece), from = C.name(m.from), to = C.name(m.to), text;
    if (m.flag === "short" || m.flag === "long") text = m.flag === "short" ? "O-O" : "O-O-O";
    else if (kind === "p") text = (m.took ? from.charAt(0) + "x" : "") + to + (m.promo ? "=" + m.promo.toUpperCase() : "");
    else {
      // Where another piece of the kind could have gone there too, the one that did is told apart by its file, or else its rank, or else both
      var twins = legal.filter((o) => o.piece === m.piece && o.to === m.to && o.from !== m.from);
      var which = !twins.length ? "" : twins.every((o) => (o.from & 7) !== (m.from & 7)) ? from.charAt(0) : twins.every((o) => (o.from >> 3) !== (m.from >> 3)) ? from.charAt(1) : from;
      text = kind.toUpperCase() + which + (m.took ? "x" : "") + to;
    }
    return text + (after.over === "checkmate" ? "#" : after.check ? "+" : "");
  }
  // What stands around the board: what each side has taken and by how much it is ahead, and the sheet of moves
  function around() {
    var worth = { w: 0, b: 0 }, taken = { w: [], b: [] };
    pos.b.forEach((p) => { if (p) worth[C.side(p)] += WORTH[C.kind(p)]; });
    log.forEach((e) => { if (e.took) taken[e.side].push(e.took); });
    [["w", "chess-white-taken"], ["b", "chess-black-taken"]].forEach((x) => {
      var el = $(x[1]), lead = worth[x[0]] - worth[x[0] === "w" ? "b" : "w"];
      el.textContent = "";
      taken[x[0]].sort((a, b) => WORTH[C.kind(b)] - WORTH[C.kind(a)]).forEach((p) => el.appendChild(figure(p)));
      if (lead > 0) el.appendChild(document.createElement("b")).textContent = "+" + lead;
    });
    var sheet = $("chess-moves");
    sheet.textContent = "";
    for (var i = 0; i < Math.max(1, Math.ceil(log.length / 2)); i++) {
      var line = sheet.appendChild(document.createElement("li"));
      line.appendChild(document.createElement("i")).textContent = i + 1 + ".";
      for (var k = 2 * i; k < 2 * i + 2; k++) {
        var cell = line.appendChild(document.createElement("span"));
        if (log[k]) { cell.textContent = log[k].text; if (k === log.length - 1) cell.className = "now"; }
      }
    }
    // The sheet shows its last lines, and on a narrow stage the end of its one line
    sheet.scrollTop = sheet.scrollHeight;
    sheet.scrollLeft = sheet.scrollWidth;
    sheet.classList.toggle("more", sheet.scrollLeft > 0);
  }

  function render() {
    var mine = !waiting && !now.over && pos.turn === "w";
    goes = {};
    // A pawn of the person's that reaches the far side always becomes a queen
    if (mine && picked >= 0) now.legal.forEach((m) => { if (m.from === picked && (!m.promo || m.promo === "q")) goes[m.to] = m; });
    var hot = now.check ? C.king(pos.b, pos.turn) : -1;
    for (var s = 0; s < 64; s++) {
      var el = cells[s], p = pos.b[s], m = goes[s], own = mine && C.side(p) === "w";
      el.className = "sq" + (((s & 7) + (s >> 3)) % 2 ? "" : " dk") + (last && (last.from === s || last.to === s) ? " last" + (C.side(last.piece) === "b" ? " theirs" : "") : "") +
        (s === hot ? " check" : "") + (mine && s === picked ? " pick" : "") + (m ? " to" + (m.took ? " cap" : "") : "") + (own || m ? " can" : "");
      el.setAttribute("aria-label", C.name(s) + (p ? ", " + (C.side(p) === "w" ? "white " : "black ") + C.NAME[C.kind(p)] : "") +
        (s === hot ? ", in check" : "") + (mine && s === picked ? ", picked up" : "") + (m ? (m.took ? ", can take here" : ", can go here") : ""));
      if (shown[s] !== p) {
        if (figures[s]) el.removeChild(figures[s]);
        figures[s] = p ? el.appendChild(figure(p)) : null;
        shown[s] = p;
      }
    }
    card.setAttribute("data-wait", waiting ? "1" : "0");
    // Whose move it is, or how the game ended, beside each of the two
    [["w", "chess-white"], ["b", "chess-black"]].forEach((x) => {
      var word = now.over === "checkmate" ? (pos.turn === x[0] ? "" : "won") : now.over ? "a draw" : pos.turn === x[0] ? "to move" : "";
      $(x[1] + "-turn").textContent = word;
      $(x[1]).classList.toggle("said", !!word);
    });
    my.line(now.over === "checkmate" ? "Checkmate. " + (pos.turn === "b" ? "You won." : AGENT + " won.")
      : now.over ? "Stalemate. " + (pos.turn === "b" ? AGENT + " has" : "You have") + " no move, so it is a draw."
      : now.check && pos.turn === "w" ? "Your king is in check."
      : waiting ? "The move is " + AGENT + "’s." : "You play White. Tap a piece and where it goes, and " + AGENT + " answers on the board.");
  }

  // A piece drawn over the board, on the square `s`, for as long as it is moving
  function flying(p, s) {
    var el = figure(p);
    el.classList.add("fly");
    el.style.left = (s & 7) * 12.5 + "%";
    el.style.top = (7 - (s >> 3)) * 12.5 + "%";
    return boardEl.appendChild(el);
  }
  // Slides what now stands on `to` there from `from`. The piece itself is already in its place:
  // only a picture of it travels, so that nothing is left half-way if the board changes meanwhile.
  // The agent's piece is lifted off the board as it goes, and is set down with some weight.
  function slide(from, to, ms, heavy) {
    var real = figures[to];
    if (!real) return;
    var fly = flying(pos.b[to], to), dx = ((from & 7) - (to & 7)) * 100, dy = ((to >> 3) - (from >> 3)) * 100, at = (part, scale) => "translate(" + dx * part + "%," + dy * part + "%) scale(" + scale + ")";
    real.style.visibility = "hidden";
    if (heavy) fly.classList.add("heavy");
    var a = fly.animate(heavy ? [{ transform: at(1, 1) }, { transform: at(0.92, 1.22), offset: 0.18 }, { transform: at(0.06, 1.22), offset: 0.86 }, { transform: at(0, 1) }] : [{ transform: at(1, 1) }, { transform: at(0, 1) }], { duration: ms, easing: heavy ? "cubic-bezier(.45,0,.2,1)" : "cubic-bezier(.3,.75,.3,1)" });
    a.onfinish = a.oncancel = () => {
      real.style.visibility = "";
      fly.remove();
      if (!heavy || a.playState !== "finished") return;
      // Set down: the piece settles, and its square takes the knock
      real.animate([{ transform: "scale(1.06, .93)", transformOrigin: "50% 85%" }, { transform: "scale(1)", transformOrigin: "50% 85%" }], { duration: 240, easing: "cubic-bezier(.2,1.4,.4,1)" });
      cells[to].animate([{ boxShadow: "inset 0 0 0 .5em color-mix(in srgb, var(--green) 50%, transparent)" }, { boxShadow: "inset 0 0 0 .05em var(--green)" }], { duration: 520, easing: "ease-out" });
    };
  }
  // An arrow along the agent's move, from the square it left to the one it reached, which is there while the piece travels and a moment after
  function arrow(from, to, ms) {
    var x1 = (from & 7) + 0.5, y1 = 7.5 - (from >> 3), x2 = (to & 7) + 0.5, y2 = 7.5 - (to >> 3), far = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / far, uy = (y2 - y1) / far;
    var line = arrowEl.querySelector("line"), tip = { x: x2 - ux * 0.3, y: y2 - uy * 0.3 }, back = { x: tip.x - ux * 0.36, y: tip.y - uy * 0.36 };
    line.setAttribute("x1", x1); line.setAttribute("y1", y1); line.setAttribute("x2", back.x); line.setAttribute("y2", back.y);
    arrowEl.querySelector("path").setAttribute("d", "M" + tip.x + " " + tip.y + " L" + (back.x - uy * 0.21) + " " + (back.y + ux * 0.21) + " L" + (back.x + uy * 0.21) + " " + (back.y - ux * 0.21) + " Z");
    arrowEl.animate([{ opacity: 0 }, { opacity: 0.6, offset: 0.1 }, { opacity: 0.6, offset: 0.7 }, { opacity: 0 }], { duration: ms + 1500 });
  }
  // Plays a move on the board: the position and the sheet, then the picture of it
  function put(m, ms, heavy) {
    var took = m.took ? { piece: m.took, at: m.flag === "ep" ? m.to + (pos.turn === "w" ? -8 : 8) : m.to } : null, legal = now.legal, side = pos.turn;
    pos = C.play(pos, m);
    now = C.state(pos);
    log.push({ side: side, text: written(m, legal, now), took: m.took });
    last = m;
    picked = -1;
    turn++;
    around();
    return () => {
      // Nothing travels where the person asked for less motion, or while the board is not the part that is shown
      if (still || !my.shown() || !boardEl.animate) return;
      // The piece that was taken fades where it stood, under the one that takes it
      if (took) {
        var ghost = flying(took.piece, took.at), a = ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms, easing: "ease-in" });
        a.onfinish = a.oncancel = () => ghost.remove();
      }
      slide(m.from, m.to, ms, heavy);
      // In castling the rook goes too
      if (m.flag === "short") slide(m.to + 1, m.to - 1, ms, false);
      if (m.flag === "long") slide(m.to - 2, m.to + 1, ms, false);
      if (heavy) arrow(m.from, m.to, ms);
    };
  }

  // The person's move: played at once, and told to the agent with all it needs to answer
  function mine(m) {
    var was = { pos: pos, last: last }, first = log.length === 0, draw = put(m, 180, false), at = turn, began = Date.now();
    waiting = !now.over;
    sent = false;
    early = null;
    $("chess-note").textContent = "";
    render();
    draw();
    box.hint(HINT);
    // A move that ended the game has no answer to wait for, and so nothing is sent: the agent is told of it with the first move of the next game
    if (now.over) { pendingId = null; box.idle(); return; }
    pendingId = newId();
    box.did("played " + log[log.length - 1].text);
    box.sending(began);
    // What the answer is made of comes first. A game's first move says that it is one, and how the game before it ended
    var data = { request: pendingId, move: C.uci(m), said: C.said(m, now), good: sound(pos, now) };
    if (first) { data.new_game = true; if (before) data.last_game = before; }
    data.fen = C.fen(pos);
    data.legal = now.legal.map(C.uci);
    my.send("move", data).then((result) => {
      if (turn !== at) return;
      var kept = early;
      sent = true;
      early = null;
      box.asked(null, result);
      // The agent had answered already: its answer is played now
      if (kept) answer(kept.reply, kept.fresh);
    }, () => {
      if (turn !== at) return;
      // The agent was not told: the move is taken back, so that the board and the agent do not come apart
      pos = was.pos; last = was.last; now = C.state(pos); waiting = false; early = null; pendingId = null; turn++;
      log.pop();
      around();
      box.did("");
      box.refused();
      render();
    });
  }
  // The agent's move
  function theirs(m, reply) {
    var draw = put(m, 620, true);
    waiting = false;
    pendingId = null;
    played = reply;
    // Its words about this move are said whatever it said about the one before
    seenNote = "";
    render();
    draw();
    box.got();
  }
  function tap(s) {
    if (waiting || now.over || pos.turn !== "w") return;
    if (goes[s]) return mine(goes[s]);
    // Another of their pieces is picked up in its place; the same one again, or anywhere else, puts it down
    picked = C.side(pos.b[s]) === "w" && s !== picked ? s : -1;
    render();
  }
  // What the agent set as its move. It counts only while the move is the agent's and the agent
  // has been told of the person's. The agent may be told, and answer, before the page hears
  // that it was: a connection that dropped between the two brings them back in that order. So
  // what is set meanwhile is kept for that move, and played when the move is known to have gone.
  function answer(reply, fresh) {
    if (!waiting || now.over || pos.turn !== "b" || !pendingId) return;
    var prefix = pendingId + ":";
    if (!reply.startsWith(prefix)) return;
    var move = reply.slice(prefix.length).trim();
    if (!move) return;
    // Hearing the same answer twice before the move was accepted must keep its request for a correction.
    if (!sent) { early = { reply: reply, fresh: fresh || !!(early && early.reply === reply && early.fresh) }; return; }
    var m = C.find(now.legal, move);
    if (m) { theirs(m, reply); noted(); }
    // Not a move it may make: the agent is told so, once for what it set, and the person is shown nothing of it
    else if (fresh) my.send("illegal", { request: pendingId, move: move.slice(0, 40), good: sound(pos, now), fen: C.fen(pos), legal: now.legal.map(C.uci) }).catch(() => {});
  }
  var text = (v) => (v == null ? "" : String(v));
  // The agent's move is `move` beside the `request` it answers. `reply`, which is the two with a colon between them, is the chessboard page's own way of saying the same
  var replyOf = (st) => (text(st.request) && text(st.move) ? text(st.request) + ":" + text(st.move) : text(st.reply));
  var revision = my.revision;
  // What was in the state when the page opened is of an earlier game, and is not a move in this one
  var seenReply = replyOf(my.answers()), seenNote = "", heardNote = "", seenRev = revision();
  // The agent's words about its move belong to the reply they are set beside. They are shown while
  // that reply is the one that was played: beside a reply to an earlier move, or to a game that was
  // started again, they are about a board that is no longer there. They are the agent's own, and
  // are written as text in the dock and beside its name
  function noted() {
    var st = my.answers(), note = Shell.tidy(st.note, 160);
    if (!played || replyOf(st) !== played || note === seenNote) return;
    seenNote = note;
    if (!note) return;
    box.say(note);
    $("chess-note").textContent = note;
  }
  function heard() {
    var st = my.answers(), reply = replyOf(st), note = Shell.tidy(st.note, 160);
    var rev = revision(), again = seenRev >= 0 && rev > seenRev, sameNote = note === heardNote;
    seenRev = rev;
    heardNote = note;
    if (reply !== seenReply) {
      seenReply = reply;
      answer(reply, true);
    } else if (again && sameNote) {
      // A repeated state still belongs only to the request its reply names.
      answer(reply, false);
    }
    noted();
  }
  // A new game is the page's own to begin, and sends nothing: the agent hears of it with the game's first move
  $("chess-new").addEventListener("click", () => {
    before = now.over === "checkmate" ? (pos.turn === "b" ? "White won by checkmate" : "Black won by checkmate") : now.over ? "drawn by stalemate" : log.length ? "left unfinished" : before;
    turn++;
    pendingId = null;
    pos = C.read(C.START); now = C.state(pos); last = null; picked = -1; waiting = false; sent = false; early = null; played = null; log = [];
    $("chess-note").textContent = "";
    around();
    render();
    box.did("");
    box.hint(HINT);
    box.idle();
  });
  my.listen(heard);
  around();
  render();
  heard();
  box.idle();
  box.hint(HINT);
});
</script>
