<!-- The drum machine: the person taps a beat, and the agent plays between their hits. Then they ask it for more with one tap: a bassline, a busier or a sparser part, swing, half time, a second bar that answers theirs. It is the one part that makes a sound. -->
<style>

  [data-part="drums"] .drums-play[data-on="1"] i { clip-path: polygon(6% 6%, 94% 6%, 94% 94%, 6% 94%); }

  [data-part="drums"] .drums-fader { --at: 50%; --tone: var(--ink); min-width: 0; display: grid; grid-template-columns: auto auto; grid-template-areas: "name value" "slide slide"; align-items: baseline; justify-content: space-between; gap: 3px 10px; width: 190px; }

  [data-part="drums"] .drums-fader > span { grid-area: name; display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  [data-part="drums"] .drums-fader > span i { display: none; width: 9px; height: 9px; border-radius: 3px; background: var(--green); }
  [data-part="drums"] .drums-fader.theirs > span i { display: block; }
  [data-part="drums"] .drums-fader output { grid-area: value; font: 600 17px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--tone); transition: color .3s; } [data-part="drums"] .drums-fader output b { font-weight: 600; }

  [data-part="drums"] .drums-fader input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--tone) var(--at), var(--pad) var(--at)); box-shadow: inset 0 1px 1px var(--dip); }
  [data-part="drums"] .drums-fader input::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--tone) var(--at), var(--pad) var(--at)); }
  [data-part="drums"] .drums-fader input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 18px; margin-top: -6px; border-radius: 4px; border: 0; background: var(--tone); box-shadow: 0 3px 6px -2px rgba(28, 26, 22, .6), inset 0 0 0 1px var(--lift); }
  [data-part="drums"] .drums-fader input::-moz-range-thumb { width: 12px; height: 18px; border-radius: 4px; border: 0; background: var(--tone); }
  [data-part="drums"] .drums-fader input:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 4px; }

  [data-part="drums"] .drums-names, [data-part="drums"] .drums-bar { display: grid; grid-template-rows: 14px repeat(4, minmax(0, 1fr)) 3px repeat(5, minmax(0, .46fr)); gap: 6px; min-height: 0; }

  [data-part="drums"] .pad.beat { --off: color-mix(in srgb, var(--pad) 91%, var(--ink)); }
  [data-part="drums"] .pad[data-r="0"] { --on: var(--hat); } [data-part="drums"] .pad[data-r="1"] { --on: var(--clap); } [data-part="drums"] .pad[data-r="2"] { --on: var(--snare); } [data-part="drums"] .pad[data-r="3"] { --on: var(--kick); }

  [data-part="drums"] .drums-ask:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-1px); } [data-part="drums"] .drums-ask:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
  [data-part="drums"] .drums-ask:disabled { opacity: .45; cursor: default; }

  @keyframes drums-asked { to { opacity: .25; } }
  [data-part="drums"] .drums-clear { margin-left: auto; }

  @media (max-width: 1100px) { [data-part="drums"] .drums-whose { display: none; } [data-part="drums"] .drums-clear { margin-left: 0; } [data-part="drums"] .drums-fader { margin-left: auto; } [data-part="drums"] .drums-fader + .drums-fader { margin-left: 0; } [data-part="drums"] .drums-ask { padding: 0 12px; font-size: 13.5px; } }
  @media (max-width: 760px) {
    [data-part="drums"] .drums-box { gap: 8px; padding: 10px 10px 10px; border-radius: 22px; }
    [data-part="drums"] .drums-top { gap: 10px; }
    [data-part="drums"] .drums-play { min-height: 42px; padding: 0 14px 0 12px; gap: 8px; font-size: 14px; }
    [data-part="drums"] .drums-fader { flex: 1 1 0; width: auto; margin: 0; gap: 2px 6px; } [data-part="drums"] .drums-fader output { font-size: 14px; } [data-part="drums"] .drums-fader > span { font-size: 9.5px; }
    [data-part="drums"] .drums-box[data-bars="2"] .drums-tabs { display: flex; }
    [data-part="drums"] .drums-deck { grid-template-columns: 30px minmax(0, 1fr); gap: 0 6px; }
    [data-part="drums"] .drums-names, [data-part="drums"] .drums-bar { gap: 4px; grid-template-rows: 12px repeat(4, minmax(0, 1fr)) 2px repeat(5, minmax(0, .5fr)); } [data-part="drums"] .drums-bar { grid-template-columns: repeat(4, minmax(0, 1fr)) 2px repeat(4, minmax(0, 1fr)); }
    [data-part="drums"] .drums-names { font-size: 8.5px; letter-spacing: .04em; } [data-part="drums"] .drums-names em { display: none; }

    [data-part="drums"] .pad { --sunk: inset 0 -3px 0 var(--dip), inset 0 1px 0 var(--lift); border-radius: 10px; } [data-part="drums"] .pad.theirs::after { right: 5px; top: 5px; width: 9px; height: 9px; border-radius: 3px; } [data-part="drums"] .drums-key { border-radius: 5px; }
    [data-part="drums"] .drums-head { top: 16px; } [data-part="drums"] .drums-start { font-size: 25px; }
    [data-part="drums"] .drums-asks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; } [data-part="drums"] .drums-to { display: none; }
    [data-part="drums"] .drums-ask { min-height: 34px; padding: 0 4px; font-size: 12px; gap: 4px; } [data-part="drums"] .drums-ask.asked::before { width: 5px; height: 5px; }

<section class="part" data-part="drums" data-title="A drum machine" data-line="Tap a few pads. A moment after you stop, {agent} plays between your hits. Then ask it for more." hidden>
  <div class="fill"><div class="drums-box" id="drums-box" data-bars="1" data-touched="0">
    <div class="drums-top">
      <button class="drums-play" type="button" id="drums-play" data-on="0"><i aria-hidden="true"></i><span>Play</span></button>
      <label class="drums-fader" id="drums-tempo-box"><span><i aria-hidden="true"></i>Tempo</span><output><b id="drums-bpm"></b><small>bpm</small></output><input type="range" id="drums-tempo" min="50" max="180" step="1" value="118" aria-label="Tempo, in beats a minute"></label>

<script>
// The person taps hits onto the pads. A moment after they stop, the page tells the agent the
// beat, and the agent answers with a part of its own, which is shown in green on the same pads
// and played in the same loop. From there one tap asks the agent for more: a bassline, a busier
// or a sparser part, swing, half time, a second bar that answers the first, a surprise. Every
// ask goes as the same action, with the beat as it stands and an answer that fits already made,
// and is answered in the same small shape: the agent's part, and a tempo or a swing where it
// sets one. The person's own hits are never the agent's to take off.
Shell.part("drums", (my) => {
  var $ = Shell.$, calm = Shell.calm;
  var box = my.box, AGENT = my.agent, newId = Shell.newId;
  var ROWS = ["hat", "clap", "snare", "kick"], NAMES = ["Hat", "Clap", "Snare", "Kick"];
  // The bass has five notes, of a scale in which no two sound wrong together: A, C, D, E and G, from the bottom
  var SCALE = ["A", "C", "D", "E", "G"], PITCH = [110, 130.81, 146.83, 164.81, 196];
  // A bar is eight steps, two to the beat, and the loop is one bar or two
  var BAR = 8, MOST = 16, BPM = 118, SLOWEST = 50, FASTEST = 180, LILT = 60;
  var el = $("drums-box"), barsEl = $("drums-bars"), head = $("drums-head"), playBtn = $("drums-play"), clearBtn = $("drums-clear"), asksEl = $("drums-asks"), tabsEl = $("drums-tabs");
  var tempoIn = $("drums-tempo"), swingIn = $("drums-swing");
  // A part is what one of the two plays: for each drum the steps it is hit on, and for the bass the note on each step, from 1, or none
  var blank = () => ({ d: ROWS.map(() => new Array(MOST).fill(false)), b: new Array(MOST).fill(0) });
  var copy = (p) => ({ d: p.d.map((row) => row.slice()), b: p.b.slice() });
  var count = (p) => p.d.reduce((n, row) => n + row.filter(Boolean).length, 0) + p.b.filter(Boolean).length;
  // A part as it is written to the agent and by it: a row of steps for each drum, `x` for a hit, and a row for the bass, with the number of the note
  var written = (p, n) => p.d.map((row) => row.slice(0, n).map((on) => (on ? "x" : ".")).join("")).concat([p.b.slice(0, n).map((v) => (v ? String(v) : ".")).join("")]);
  var mine = blank(), theirs = blank(), steps = BAR, bpm = BPM, swing = 0;
  // What is asked of the agent and not yet superseded: its id, how long a loop it is about, and what it was offered
  var req = null, asked = false, sendTimer = 0, trades = 0;
  var HINT = "Tap a few pads. A moment after you stop, " + AGENT + " plays between your hits, and says here what it added.";
  // How much has been played so far, kept where it can be counted
  var meter = (window.__drums = { audio: "none", steps: 0, notes: 0 });

  // ── The sound: every drum and the bass are made here, from a tone or from noise ──
  var AC = window.AudioContext || window.webkitAudioContext, ctx = null, out = null, hiss = null;
  // The browser lets sound start only from a tap, so this is called from every one
  function audio() {
    if (!AC) return null;
    if (!ctx) {
      try {
        ctx = new AC();
        // Everything at once is held under the top, so that nothing is ever cut off
        var squeeze = ctx.createDynamicsCompressor(), trim = ctx.createGain();
        out = ctx.createGain();
        out.gain.value = .8;
        trim.gain.value = .8;
        out.connect(squeeze);
        squeeze.connect(trim);
        trim.connect(ctx.destination);
        hiss = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        var d = hiss.getChannelData(0);

    if (k === "time") fits.bpm = bpm < 90 ? Math.min(FASTEST, bpm * 2) : Math.max(SLOWEST, Math.round(bpm / 2));

  // ── What goes to the agent, and what comes back ──
  var seen = (from, k) => { try { return JSON.stringify(from && from[k]); } catch (e) { return undefined; } };

    clearTimeout(sendTimer);
    var n = count(mine);

      if (asked || count(theirs)) empty();

    }

    req = { id: id, ask: a.k, steps: loop, fits: fits, was: holders().map((h) => ({ bpm: seen(h, "bpm"), swing: seen(h, "swing") })), answered: false, back: false, taken: null };
    asked = true;
    box.did(a.did());
    box.sending();
    paint();
    tabsPaint();
    my.send("beat", { request: id, ask: a.ask(), fits: fits, pattern: written(mine, loop), yours: written(theirs, loop), rows: ROWS.concat(["bass"]), steps: loop, bpm: bpm, swing: swing, scale: "bass notes 1 to 5 are " + SCALE.join(" ") + ", low to high" }).then((result) => {

  // The agent's part as it wrote it: a row for each drum, as long as the loop it was asked about, with `x` for a hit, and after them a row for the bass, with the number of a note of the scale. No rows at all is no hits, and anything else is not taken
  function read(v, n) {

    var all = holders(), which = all[0].request === req.id ? 0 : all[1] && all[1].request === req.id ? 1 : -1, got = all[which];

    var given = (name, low, high) => {

    if (lilt !== null && lilt !== swing) { setSwing(lilt, true); said.push("set the swing to " + lilt); heard = true; }
    if (part) {
      if (req.steps !== steps) bars(req.steps);
      if (first && req.ask === "trade") trades++;
      theirs = part;
      var added = 0;
      theirs.d.forEach((row, r) => row.forEach((on, c) => { if (on && !mine.d[r][c]) added++; }));
      theirs.b.forEach((v, c) => { if (v && v !== mine.b[c]) added++; });
      said.unshift(added ? "plays " + added + (added === 1 ? " hit" : " hits") + " between yours" : "added no hits");
      heard = heard || added > 0;

    if (first) box.got();

    if (heard && !playing && my.shown()) { audio(); start(); }
    if (part) land(was);

    var text = typeof got.note === "string" ? got.note.trim().slice(0, 160) : "";

  paint();
  tabsPaint();

});
