<script>

  function write(n, text, typed) {

      var kids = [].filter.call(copy.children, (c) => !c.hidden), has = copy.getBoundingClientRect();
      if (!kids.length || !has.height) return false;
      return kids[kids.length - 1].getBoundingClientRect().bottom - kids[0].getBoundingClientRect().top > has.height + 1 || kids.some((c) => c.getBoundingClientRect().width > has.width + 1);
    };
    // Nothing eases from one size to the next while they are tried, or each would be measured as the one before
    art.classList.add("studio-measured");
    art.style.setProperty("--studio-fit", "1");
    while (k > .56 && over()) {
      k -= .04;
      art.style.setProperty("--studio-fit", k.toFixed(2));
    }
    void art.offsetWidth;
    art.classList.remove("studio-measured");
  }
  var VARS = ["paper", "ink", "accent", "on", "second", "on2", "tint", "loud", "shade", "deep", "dusk", "pale"];
  function paint(r) {
    VARS.forEach((k) => { if (r) art.style.setProperty("--s-" + k, hex(r[k])); else art.style.removeProperty("--s-" + k); });
  }
  var ground = (r) => { if (r) art.style.setProperty("--s-ground", hex(r.paper)); else art.style.removeProperty("--s-ground"); };
  /** The place on the page's edge that is nearest the knob of the wheel, which is where colour comes onto the page from. */
  function edge() {
    var a = art.getBoundingClientRect(), k = knob.getBoundingClientRect();
    return within(((k.left + k.width / 2 - a.left) / (a.width || 1)) * 100, 0, 100).toFixed(1) + "% " + within(((k.top + k.height / 2 - a.top) / (a.height || 1)) * 100, 0, 100).toFixed(1) + "%";
  }
  var dabbed = "0% 50%";
  /** The colour the person picked is put on the edge of the page as a dab of paint, and stays there while the agent has it. With nothing, the dab is taken off. */
  function dab(c) {
    var w = $("studio-wash");
    if (c) { dabbed = edge(); w.style.background = hex(c); }
    w.style.transition = "";
    w.style.clipPath = "circle(" + (c ? "2.1em" : "0%") + " at " + dabbed + ")";
  }
  /** The colour of a design comes over the page from where the dab is. */
  function wash(r) {
    var w = $("studio-wash");
    w.style.transition = "background .3s, clip-path .9s cubic-bezier(.3, .7, .2, 1)";
    w.style.background = hex(r.paper);
    w.style.clipPath = "circle(150% at " + dabbed + ")";
    later(900, () => { ground(r); w.style.transition = "none"; w.style.clipPath = "circle(0% at " + dabbed + ")"; });
  }
  /** What the design is made of, on the bench. */
  function listed() {
    var dots = $("studio-swatches").children, made = !!look;
    $("studio-spec").setAttribute("data-made", "0");
    ["paper", "ink", "accent", "second"].forEach((k, i) => { dots[i].style.background = made ? hex(look.colours[k]) : ""; });
    $("studio-palette").textContent = made ? look.palette : "no design yet";
    $("studio-type").textContent = made ? look.type : "";
    $("studio-shape").textContent = made ? look.shape : "";
    $("studio-by").hidden = !made;
    if (made) { void $("studio-spec").offsetWidth; $("studio-spec").setAttribute("data-made", "1"); }
    $("studio-own").hidden = !made;
    $("studio-own").textContent = worn ? "Tour’s own colours" : "Wear the design";
  }
  /**
   * Dresses the frame of the tour in the design: its accent, and a tint of it in the paper. The
   * colours are worked out against the frame's own paper and ink, light or dark as they are, and
   * the shell takes them only where everything can still be read.
   */
  function wear() {
    Shell.wear(null);
    worn = false;
    if (!look) return;
    var cs = window.getComputedStyle(document.documentElement), mine = (k) => rgb(cs.getPropertyValue(k));
    var paper = mine("--paper"), card = mine("--card"), line = mine("--line");
    if (!paper || !card || !line) return;
    // The colour a design is known by is its accent, or where that is next to grey, the stronger of its paper and its second colour
    var chroma = (t) => t[1] * (1 - Math.abs(2 * t[2] - 1)), known = [look.colours.accent, look.colours.paper, look.colours.second].map(tone);
    var key = chroma(known[0]) >= .25 ? known[0] : chroma(known[1]) >= chroma(known[2]) ? known[1] : known[2], dark = lum(paper) < .2;
    var accent = sure(off(key[0], within(key[1], .45, .85), dark ? .62 : .42, dark ? paper : card, 3.6)), tint = hsl(key[0], .7, dark ? .32 : .6);
    worn = Shell.wear({ "--green": hex(accent[0]), "--on-green": hex(accent[1]), "--green-soft": hex(mix(card, accent[0], .16)), "--paper": hex(mix(paper, tint, .1)), "--card": hex(mix(card, tint, .045)), "--line": hex(mix(line, tint, .16)) });
  }
  function unmark() {
    NAMES.forEach((n) => { pieces[n].el.classList.remove("studio-on", "studio-asked", "studio-by", "studio-pop"); pieces[n].el.removeAttribute("data-tag"); });
  }
  function hold(yes) {
    busy = yes;
    part.setAttribute("data-wait", yes ? "1" : "0");
    [].forEach.call($("studio-moods").children, (b) => { b.disabled = yes; });
  }

  // ── The first gesture: a colour, and a mood, and the agent designs the page ──
  function aim(h, r) {
    brief.h = ((h % 360) + 360) % 360;
    brief.r = within(r, 0, .96);
    var a = (brief.h * Math.PI) / 180;
    knob.style.left = (50 + Math.sin(a) * brief.r * 50).toFixed(2) + "%";
    knob.style.top = (50 - Math.cos(a) * brief.r * 50).toFixed(2) + "%";
    knob.style.background = hex(colourAt(brief.h, brief.r));
  }
  function design(why) {
    if (busy) return;
    settle();
    shut();
    unmark();
    var offered = palettes(brief.h, brief.r), mood = brief.mood, set = LOOK[mood || strength(brief.r)];
    var pick = { palette: set[0], type: set[1], shape: set[2], picture: set[3] }, sent = {};
    Object.keys(offered).forEach((k) => { sent[k] = offered[k].map(hex); });
    pending = { kind: "design", offered: offered, pick: pick };
    $("studio-note").textContent = called(brief.h, brief.r) + (mood ? ", " + mood : "");
    hold(true);
    dab(colourAt(brief.h, brief.r));
    box.did(why === "mood" ? "chose a mood" : "picked a colour");
    asker.send("design", {
      colour_is: called(brief.h, brief.r),
      colour: hex(colourAt(brief.h, brief.r)),
      mood: mood,
      for: FOR,
      pick: pick,
      most: { headline: MOST.headline, line: MOST.line },
      palettes: sent,
      palette_is: IS,
      type: TYPES,
      shape: SHAPES,
      picture: SCENES,
      now: { headline: pieces.headline.text, line: pieces.line.text },
    });
  }
  function designed(got, p) {
    var name = own(p.offered, got.palette) ? got.palette : null;
    var colours = name ? p.offered[name] : Array.isArray(got.palette) ? given(got.palette) : null;
    if (!colours) { name = p.pick.palette; colours = p.offered[name]; }
    look = {
      palette: name || "its own",
      colours: roles(colours),
      type: own(TYPES, got.type) ? got.type : p.pick.type,
      shape: SHAPES.indexOf(got.shape) >= 0 ? got.shape : p.pick.shape,
      picture: SCENES.indexOf(got.picture) >= 0 ? got.picture : p.pick.picture,
    };
    var headline = tidy(got.headline, MOST.headline), line = tidy(got.line, MOST.line), first = art.getAttribute("data-skin") === "draft";
    // A design is the whole page again: every piece is back, at its own size
    NAMES.forEach((n) => { pieces[n].size = 2; pieces[n].tone = "plain"; pieces[n].show = true; });
    unmark();
    art.setAttribute("data-skin", "made");
    paint(look.colours);
    if (Shell.calm || !my.shown()) { ground(look.colours); dab(null); } else wash(look.colours);
    wear();
    later(380, () => {
      art.setAttribute("data-type", look.type);
      art.setAttribute("data-shape", look.shape);
      art.setAttribute("data-picture", scene = look.picture);
      stand();
      // The words of the page stay as they are where the answer has none of its own
      if (headline) write("headline", headline, true);
      if (line) { write("line", line, false); pieces.line.el.classList.add("studio-pop"); }
      fit();
      listed();
      $("studio-tap").textContent = "now tap any piece of it";
      $("studio-tap").classList.toggle("studio-on", first);
    });
    my.line("Tap any piece of the page and say what is wrong with it. {agent} changes just that.");
  }

  // ── The second gesture: a piece is pointed at, with a word for what is wrong with it ──
  /** The four words a piece is given, each with the change it asks for as the page has worked it out. */
  function wishes(n) {
    var p = pieces[n], at = TONES.indexOf(p.tone);
    return [
      p.size < SIZES.length ? { wish: "bigger", key: "size", change: { size: p.size + 1 } } : { wish: "smaller", key: "size", change: { size: p.size - 1 } },
      at > 0 ? { wish: "calmer", key: "tone", change: { tone: TONES[at - 1] } } : { wish: "louder", key: "tone", change: { tone: TONES[at + 1] } },
      n === "picture" ? { wish: "draw it differently", key: "picture", change: { picture: SCENES[(SCENES.indexOf(scene) + 1) % SCENES.length] } } : { wish: "say it differently", key: "text", change: { text: "<your words, at most " + MOST[n] + " letters>" } },
      { wish: "lose it", key: "show", change: { show: false } },
    ];
  }
  var words = [].slice.call(ask.children), offeredNow = [];
  function shut() {
    if (ask.hidden) return;
    ask.hidden = true;
    if (chosen && !busy) pieces[chosen].el.classList.remove("studio-on");
    chosen = null;
  }
  /** Puts the words beside the piece: under it where there is room, over it where there is not, and on it where it is the picture. */
  function place(n) {
    var r = pieces[n].el.getBoundingClientRect(), all = room.getBoundingClientRect(), w = ask.offsetWidth || 300, h = ask.offsetHeight || 108;
    var x = r.left - all.left, y = r.bottom - all.top + 16;
    if (n === "picture") { x = r.left - all.left + (r.width - w) / 2; y = r.top - all.top + (r.height - h) / 2 + 18; }
    else if (y + h > all.height) y = r.top - all.top - h - 16;
    ask.style.left = within(x, 0, Math.max(0, all.width - w)).toFixed(0) + "px";
    ask.style.top = within(y, 0, Math.max(0, all.height - h)).toFixed(0) + "px";
  }
  function point(n, byKey) {
    if (busy) return;
    settle();
    var again = chosen === n && !ask.hidden;
    shut();
    if (again) return;
    unmark();
    chosen = n;
    offeredNow = wishes(n);
    words.forEach((b, i) => { var t = offeredNow[i].wish; b.textContent = t.charAt(0).toUpperCase() + t.slice(1); });
    pieces[n].el.setAttribute("data-tag", LABEL[n]);
    pieces[n].el.classList.add("studio-on");
    $("studio-tap").classList.remove("studio-on");
    ask.hidden = false;
    place(n);
    if (byKey) words[0].focus({ preventScroll: true });
  }
  function want(w) {
    var n = chosen, p = pieces[n];
    if (busy || !n || !w) return;
    ask.hidden = true;
    chosen = null;
    p.el.setAttribute("data-tag", LABEL[n] + " · " + w.wish);
    p.el.classList.add("studio-on", "studio-asked");
    pending = { kind: "point", piece: n, wish: w.wish, key: w.key, change: w.change };
    hold(true);
    box.did(DID[w.wish]);
    var data = { piece: n, wish: w.wish, try: w.change }, page = {};
    if (w.key === "text") { data.text = p.text; data.most = MOST[n]; }
    if (w.key === "size") { data.size = p.size; data.sizes = SIZES; }
    if (w.key === "tone") { data.tone = p.tone; data.tones = TONES; }
    if (w.key === "picture") { data.picture = scene; data.pictures = SCENES; }
    NAMES.forEach((k) => { if (k !== "picture" && pieces[k].show) page[k] = pieces[k].text; });
    data.mood = brief.mood;
    data.for = FOR;
    data.page = page;
    asker.send("point", data);
  }
  function pointed(got, q) {
    var n = q.piece, p = pieces[n], v;
    unmark();
    if (q.key === "size") p.size = SIZES.indexOf(got.size) >= 0 && got.size !== p.size ? got.size : q.change.size;
    if (q.key === "tone") p.tone = TONES.indexOf(got.tone) >= 0 && got.tone !== p.tone ? got.tone : q.change.tone;
    if (q.key === "picture") { v = SCENES.indexOf(got.picture) >= 0 && got.picture !== scene ? got.picture : q.change.picture; art.setAttribute("data-picture", scene = v); }
    if (q.key === "show") p.show = got.show === true;
    // A piece is given other words only where the answer has words of its own for it: the page writes none
    v = q.key === "text" ? tidy(got.text, MOST[n]) : "";
    if (!p.show) {
      // It goes, and then the page closes up over where it was
      p.el.classList.add("studio-gone");
      later(280, () => { stand(); fit(); });
      return;
    }
    stand();
    if (v && v !== p.text) write(n, v, true);
    fit();
    p.el.setAttribute("data-tag", my.agent.slice(0, 16).toLowerCase());
    p.el.classList.add("studio-by", "studio-pop");
  }

  var asker = my.asker((got) => {
    var q = pending;
    pending = null;
    settle();
    hold(false);
    if (!q) return;
    if (q.kind === "design") designed(got, q); else pointed(got, q);
    box.say(got.say);
  }, () => {
    // No answer came, or It did not take it: the studio is the person's again, with nothing of the agent's drawn
    hold(false);
    if (pending && pending.kind === "design") dab(null);
    if (pending && pending.kind === "point") pieces[pending.piece].el.classList.remove("studio-asked");
  });

  // ── The person's hands ──
  var where = (e) => {
    var r = wheel.getBoundingClientRect(), half = Math.min(r.width, r.height) / 2 || 1, dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    return [(Math.atan2(dx, -dy) * 180) / Math.PI, Math.hypot(dx, dy) / half];
  };
  wheel.addEventListener("pointerdown", (e) => {
    if (busy) return;
    // What the person does to the colour now is what an answer still on its way was not asked about
    asker.forget();
    pending = null;
    held = true;
    try { wheel.setPointerCapture(e.pointerId); } catch (err) {}
    wheel.classList.add("studio-held");
    var at = where(e);
    aim(at[0], at[1]);
    $("studio-note").textContent = called(brief.h, brief.r);
  });
  wheel.addEventListener("pointermove", (e) => { if (!held) return; var at = where(e); aim(at[0], at[1]); $("studio-note").textContent = called(brief.h, brief.r); });
  var let_go = () => { if (!held) return; held = false; wheel.classList.remove("studio-held"); design("colour"); };
  wheel.addEventListener("pointerup", let_go);
  wheel.addEventListener("pointercancel", let_go);
  wheel.addEventListener("keydown", (e) => {
    if (busy) return;
    var step = { ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, .08], ArrowDown: [0, -.08] }[e.key];
    if (step) { e.preventDefault(); aim(brief.h + step[0], brief.r + step[1]); $("studio-note").textContent = called(brief.h, brief.r); }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); design("colour"); }
  });
  [].forEach.call($("studio-moods").children, (b) => b.addEventListener("click", () => {
    if (busy) return;
    brief.mood = b.getAttribute("data-mood");
    [].forEach.call($("studio-moods").children, (o) => o.setAttribute("aria-pressed", o === b ? "true" : "false"));
    design("mood");
  }));
  // A press that came from the keyboard has no place on the screen, and takes the keyboard on to the words
  NAMES.forEach((n) => pieces[n].el.addEventListener("click", (e) => point(n, e.detail === 0)));
  words.forEach((b, i) => b.addEventListener("click", () => want(offeredNow[i])));
  part.addEventListener("pointerdown", (e) => { if (!ask.hidden && !ask.contains(e.target) && !(e.target.closest && e.target.closest(".studio-piece"))) shut(); });
  part.addEventListener("keydown", (e) => { if (e.key === "Escape") shut(); });
  $("studio-own").addEventListener("click", () => {
    if (worn) { Shell.wear(null); worn = false; } else wear();
    $("studio-own").textContent = worn ? "Tour’s own colours" : "Wear the design";
  });
  function again() {
    settle();
    asker.forget();
    pending = null;
    hold(false);
    shut();
    unmark();
    look = null;
    Shell.wear(null);
    worn = false;
    paint(null);
    ground(null);
    dab(null);
    art.setAttribute("data-skin", "draft");
    art.setAttribute("data-type", "display");
    art.setAttribute("data-shape", "soft");
    art.setAttribute("data-picture", scene = "sun");
    NAMES.forEach((n) => { var p = pieces[n]; p.size = 2; p.tone = "plain"; p.show = true; if (n !== "picture") write(n, DRAFT[n], false); });
    stand();
    brief.mood = null;
    [].forEach.call($("studio-moods").children, (o) => o.setAttribute("aria-pressed", "false"));
    aim(22, .8);
    $("studio-note").textContent = "drag, and let go";
    $("studio-tap").textContent = "a page with no design yet";
    $("studio-tap").classList.add("studio-on");
    listed();
    fit();
    my.line();
    box.idle();
    box.did("");
    box.hint(HINT);
  }
  $("studio-again").addEventListener("click", again);

  // The page is fitted to the easel again whenever the easel changes its size, and the words for a piece are put away, since their place was worked out for the old one
  if (window.ResizeObserver) new ResizeObserver(() => { shut(); fit(); }).observe($("studio-easel"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit, () => {});
  // The frame's own colours are others when the screen goes from light to dark, so what it wears is worked out again
  var scheme = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  if (scheme && scheme.addEventListener) scheme.addEventListener("change", () => { if (worn) { wear(); listed(); } });
  my.onEnter(fit);
  my.onLeave(() => { settle(); shut(); });
  $("studio-by-who").textContent = my.agent;
  again();
});
</script>
