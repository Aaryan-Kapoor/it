      var name = tidy(m && typeof m === "object" && !Array.isArray(m) ? m.turn : m, 40).toLowerCase();
      if (!Object.hasOwn(asked.turns, name)) out++;
      else if (steps.length < 3) steps.push({ turn: asked.turns[name], words: tidy(m && typeof m === "object" ? m.say : "", 90) });
    });
    var sent = { sent: given.length, out: out, over: given.length - out > 3 };
    if (!steps.length) { note(given.length ? told(sent) : AGENT + " sent no turns."); return paint(); }
    walk = { steps: steps, at: 0, frame: asked.frame, auto: false, sent: sent.sent, out: out, over: sent.over };
    note("");
    glide(walk.frame);
    paint();
  }, () => { asking = false; paint(); });
  askBtn.addEventListener("click", () => {
    if (asking || playing || walk || home(faces)) return;
    // The way back is every turn since the cube was solved, undone from the last, and the agent is given the next three of it
    var back = way.slice().reverse().map(undone), next = back.slice(0, 3), now = frameNow(), k = now, least = 4;
    // Their names are as the cube is held now, or as it is held from the side nearest to that from which the fewest of them are hard to say
    [now, (now + 1) % 4, (now + 3) % 4, (now + 2) % 4].forEach((f) => { var hard = next.filter((t) => nameOf(t, f).hard).length; if (hard < least) { least = hard; k = f; } });
    asked = { frame: k, turns: turnsBy(k) };
    asking = true;
    note("");
    paint();
    box.did("asked the way");
    asker.send("turned", { back: next.map((t) => { var n = nameOf(t, k); return { turn: n.turn, plain: n.plain }; }), more: back.length - next.length, cube: seen(k) });
  });
  autoBtn.addEventListener("click", () => {
    if (!walk || playing) return;
    walk.auto = true; playing = true;
    paint();
    (function next() {
      // The turns are played while the part is shown, and are the person's again where it is left
      if (!walk || !walk.auto || !my.shown()) { if (walk) walk.auto = false; playing = false; return paint(); }
      var t = walk.steps[walk.at].turn;
      play(t, 520, () => { apply(t); stepped(); if (walk) setTimeout(next, calm ? 700 : 320); });
    })();
  });

  my.onEnter(() => {
    measure();
    if (first) {
      // The cube is mixed before the person's eyes the first time it is come to, where things move and there is a drawing to see it on
      var turns = first;
      first = null;
      if (canvas.offsetWidth) { playing = true; paint(); setTimeout(() => each(turns, 300, () => { playing = false; paint(); }), 650); }
      else turns.forEach(apply);
    }
    paint();
  });
  my.onLeave(() => { if (walk) walk.auto = false; bits = []; });
  if (window.ResizeObserver) new ResizeObserver(() => { measure(); wake(); }).observe(el);
  if (scheme && scheme.addEventListener) scheme.addEventListener("change", wake);
  canvas.addEventListener("focus", wake);
  canvas.addEventListener("blur", wake);

  // Two turns from solved to begin with, a different two each time
  var first = mixed(2, true);
  if (calm) { first.forEach(apply); first = null; }
  measure();
  paint();
  box.idle();
  box.hint(HINT);
  // What a test needs of the cube: how it turns, how it stands, and where a square is on the page
  window.__cube = {
    SOLVED: SOLVED, turned: turned, home: home, nameOf: nameOf,
    now: () => ({ faces: faces, way: way.slice(), frame: frameNow() }),
    spot: (c, n) => { measure(); aim(); var p = P([0, 1, 2].map((x) => c[x] + n[x] * 0.5)); return [p[0] + left, p[1] + top]; },
  };
});
</script>
