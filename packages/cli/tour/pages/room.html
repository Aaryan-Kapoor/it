<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A control room</title>
<style>
/*kit.css*/
  /* Up to four tiles, which the agent defines in the page's state. One alone has the whole of
     its side of the screen, two stand side by side, three are one wide over two, and four are
     two rows of two. On a narrow screen they are one under another. */
  .t-card { align-items: stretch; justify-content: center; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--w-ghost) transparent; }
  .room { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: auto 0; }
  .room[data-n="0"] { display: none; }
  .room[data-n="1"] { grid-template-columns: minmax(0, 1fr); }
  .room[data-n="3"] .tile:first-child { grid-column: span 2; }
  #none { margin: auto; max-width: 30ch; text-align: center; font-family: var(--w-mono); font-size: 12.5px; line-height: 1.6; color: var(--w-faint); }
  #none[hidden] { display: none; }

  /* A tile is drawn by the field first, as a line of dots round where it will be, and then filled */
  .tile {
    position: relative; min-width: 0; padding: 22px 24px 24px; border-radius: 18px; border: 1px solid var(--w-line); background: rgba(6, 6, 6, .78);
    opacity: 0; transform: scale(.985); transition: opacity .45s, transform .6s var(--w-ease), border-color .4s, box-shadow .6s;
  }
  .tile.in { opacity: 1; transform: none; }
  .tile.out { opacity: 0; }
  .tile .label { display: flex; align-items: center; gap: 9px; min-height: 16px; font-family: var(--w-mono); font-size: 11.5px; letter-spacing: .03em; color: var(--w-faint); }
  .tile .title { margin: 10px 0 0; font-size: clamp(25px, 2.9vw, 42px); line-height: 1.02; letter-spacing: -.04em; font-weight: 700; overflow-wrap: anywhere; }
  .tile .title.long { font-size: clamp(19px, 1.9vw, 27px); line-height: 1.12; letter-spacing: -.03em; }
  .tile .text { margin: 12px 0 0; max-width: 56ch; font-size: 15px; line-height: 1.45; color: var(--w-muted); overflow-wrap: anywhere; }
  .tile ul { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-family: var(--w-mono); font-size: 12.5px; color: var(--w-muted); }
  .tile li { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile li b { margin-right: 10px; font-weight: 500; color: var(--w-fg); }
  .tile [hidden] { display: none; }
  /* A row of dots, each good, bad or not yet known: this is how tests are shown */
  .tile .dots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .tile .dots i { width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px #4a4a4a; transition: background .2s, box-shadow .3s, transform .3s var(--w-ease); }
  .tile .dots i[data-s="g"] { background: var(--w-ok); box-shadow: 0 0 12px rgba(52, 211, 153, .65); }
  .tile .dots i[data-s="b"] { background: var(--w-red); box-shadow: 0 0 12px rgba(255, 91, 69, .7); }
  .tile .dots i.lit { transform: scale(1.5); }
  body.w .tile .t-btn { margin-top: 20px; }
  body.w .tile .t-btn[data-picked] { color: var(--w-ok); border-color: var(--w-ok); }
  /* The agent says it is at work on this one: its line is green, and a ring turns before its label */
  .tile[data-busy="1"] { border-color: rgba(52, 211, 153, .55); box-shadow: 0 0 60px -18px rgba(52, 211, 153, .5); }
  .tile[data-busy="1"] .label { color: var(--w-ok); }
  .tile[data-busy="1"] .label::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px dashed var(--w-ok); animation: w-turn 1.1s linear infinite; }
  /* The thing the agent will not do without the person's word stands apart: a white line, and a button that is filled */
  .tile[data-ask="1"] { border: 1.5px solid var(--w-fg); box-shadow: 0 0 70px -22px rgba(255, 255, 255, .55); }
  .tile[data-ask="1"] .label { color: var(--w-fg); }
  body.w .tile[data-ask="1"] .t-btn { padding: 10px 20px; border: 0; border-radius: 999px; background: var(--w-fg); color: var(--w-bg); }
  body.w .tile[data-ask="1"] .t-btn:hover:not(:disabled), body.w .tile[data-ask="1"] .t-btn[data-picked] { background: var(--w-ok); color: var(--w-ink); }
  /* A tile the agent has just changed is lit for a moment */
  .tile.changed { animation: changed 1s var(--w-ease); }
  @keyframes changed { 0% { border-color: var(--w-ok); box-shadow: 0 0 80px -10px rgba(52, 211, 153, .8); } }
  /* One tile alone is as large as its words can be */
  .room[data-n="1"] .tile { padding: clamp(24px, 4vw, 54px); }
  .room[data-n="1"] .title { font-size: clamp(38px, 5.6vw, 88px); line-height: .98; }
  .room[data-n="1"] .title.long { font-size: clamp(24px, 3vw, 44px); line-height: 1.06; }
  .room[data-n="1"] .text { margin-top: 20px; font-size: clamp(15px, 1.4vw, 19px); }
  @media (max-width: 820px) {
    .t-card { justify-content: flex-start; padding-top: 44px; }
    .room { grid-template-columns: minmax(0, 1fr); gap: 10px; margin: 0; }
    .room[data-n="3"] .tile:first-child { grid-column: auto; }
    .tile { padding: 16px 18px 18px; }
    #none { margin-top: 18vh; }
  }
  @media (prefers-reduced-motion: reduce) { .tile, .tile .dots i { transition: none; } .tile.changed, .tile[data-busy="1"] .label::before { animation: none; } }
</style>
</head>
<body class="w">
  <div class="t-wrap">
    <div class="t-words">
      <h1 class="t-h" id="head">{{heading}}</h1>
      <p class="t-sub">{{sub}}</p>
      <div class="t-log" aria-live="polite">
        <p class="t-you" id="t-you"><span>you</span><b></b></p>
        <p class="t-did" id="t-did"><span></span><b></b></p>
      </div>
    </div>
    <div class="t-card" id="stage">
      <p id="none"></p>
      <div class="room" id="room" data-n="0"></div>
    </div>
  </div>
<!--rail-->
<script>
/*kit.js*/
</script>
<script>
  // A control room for the folder the agent is in. The page comes with It and the agent fills
  // it, in the page's state, with what it finds there: `tiles` holds up to four, each under an
  // id of the agent's choosing, as
  //   { at, label, title, text, lines, dots, button, busy, ask }
  // `at` is a number the tiles are ordered by. `label` is a few small words and `title` the
  // large ones. `text` is a sentence. `lines` are up to six short lines, each a pair of a
  // strong part and the rest, or one string. `dots` is a row of dots, written as one letter
  // each: `g` for good, `b` for bad, and anything else for not yet known. `button` is the
  // words on a button, which sends "press" with the tile's id and those words. `busy` says the
  // agent is at work on that tile, and `ask` marks the one thing it will not do without the
  // person's word. `note` is a sentence of the agent's own under the words.
  //
  // A tile appears when the agent writes it and changes when the agent changes it, and the
  // hand goes to the tile that did. The field draws a tile's outline before the tile fills,
  // and the hand lights a row of dots one at a time.
  Tour.ready(() => {
    var It = Tour.It, hand = Tour.hand, agent = Tour.agent;
    var $ = (id) => document.getElementById(id);
    var room = $("room"), none = $("none"), stage = $("stage");
    var MOST = 4;
    var shown = Object.create(null);       // each tile on the page, by its id: { el, was, pressed }
    var work = Promise.resolve();
    var opened = false;   // whether the state the page opened with has been shown: tiles that were there then are simply there
    var words = (v, most) => (typeof v === "string" || typeof v === "number" ? String(v).replace(/\s+/g, " ").trim().slice(0, most) : "");
    none.textContent = "What " + agent + " finds in this folder goes here.";

    // The tiles the state has, in their order: at most four
    function wanted() {
      var tiles = (It.state || {}).tiles, out = [];
      if (!tiles || typeof tiles !== "object" || Array.isArray(tiles)) return out;
      Object.keys(tiles).forEach((id, i) => {
        var t = tiles[id];
        if (t && typeof t === "object" && !Array.isArray(t)) out.push({ id: id, t: t, at: typeof t.at === "number" ? t.at : 1000 + i });
      });
      return out.sort((a, b) => a.at - b.at).slice(0, MOST);
    }
    function build(id) {
      var el = document.createElement("section");
      el.className = "tile";
      el.setAttribute("data-id", id);
      el.innerHTML = '<div class="label"></div><h2 class="title"></h2><p class="text"></p><ul></ul><div class="dots" role="img"></div><button class="t-btn" type="button"></button>';
      var button = el.querySelector("button");
      button.addEventListener("click", () => {
        var said = button.textContent;
        button.setAttribute("data-picked", "1");
        Tour.say("you", "pressed " + said);
        Tour.act("press", { tile: id, button: said }).catch(() => button.removeAttribute("data-picked"));
      });
      return el;
    }
    var state = (ch) => (ch === "g" || ch === "b" ? ch : "u");
    // Everything of a tile but its dots, which the hand lights
    function fill(el, t) {
      var title = words(t.title, 140), text = words(t.text, 260), button = words(t.button, 40);
      el.setAttribute("data-busy", t.busy === true ? "1" : "0");
      el.setAttribute("data-ask", t.ask === true ? "1" : "0");
      el.querySelector(".label").textContent = words(t.label, 48) + (t.ask === true ? (words(t.label, 48) ? " · " : "") + "waits for your word" : "");
      el.querySelector(".title").textContent = title;
      el.querySelector(".title").classList.toggle("long", title.length > 30);
      el.querySelector(".text").textContent = text;
      el.querySelector(".text").hidden = !text;
      var ul = el.querySelector("ul");
      ul.textContent = "";
      (Array.isArray(t.lines) ? t.lines : []).slice(0, 6).forEach((line) => {
        var li = document.createElement("li"), strong = Array.isArray(line) ? words(line[0], 60) : "", rest = Array.isArray(line) ? words(line[1], 120) : words(line, 160);
        if (!strong && !rest) return;
        if (strong) li.appendChild(document.createElement("b")).textContent = strong;
        li.appendChild(document.createTextNode(rest));
        ul.appendChild(li);
      });
      ul.hidden = !ul.children.length;
      var b = el.querySelector("button");
      b.textContent = button;
      b.hidden = !button;
      b.removeAttribute("data-picked");
    }
    // The row of dots. Those that change are lit one at a time, by the hand where it moves
    async function dots(el, t, moving) {
      var row = el.querySelector(".dots"), want = words(t.dots, 80).split("").map(state);
      row.hidden = !want.length;
      row.setAttribute("aria-label", want.length ? want.filter((s) => s === "g").length + " good, " + want.filter((s) => s === "b").length + " bad, " + want.filter((s) => s === "u").length + " not yet known" : "");
      while (row.children.length > want.length) row.lastChild.remove();
      while (row.children.length < want.length) row.appendChild(document.createElement("i")).setAttribute("data-s", "u");
      for (var i = 0; i < want.length; i++) {
        var dot = row.children[i];
        if (dot.getAttribute("data-s") === want[i]) continue;
        if (moving) {
          await hand.to(dot, "middle", 70);
          dot.classList.add("lit");
          World.sound.step();
        }
        dot.setAttribute("data-s", want[i]);
        if (moving) { await World.wait(40); dot.classList.remove("lit"); }
      }
    }
    // One tile is brought to what the state says of it now: drawn and filled if it is new, changed if it is not
    async function bring(id) {
      var one = wanted().find((w) => w.id === id), had = shown[id];
      if (!one || !had) return;
      var now = JSON.stringify(one.t), moving = opened && World.moving;
      if (had.was === now) return;
      var fresh = had.was === null;
      had.was = now;
      if (fresh) {
        fill(had.el, one.t);
        await dots(had.el, one.t, false);
        if (moving) {
          had.el.scrollIntoView({ block: "nearest" });
          hand.to(had.el, "corner", 420);
          var release = await World.outline(had.el);
          had.el.classList.add("in");
          World.sound.thud();
          setTimeout(release, 200);
          await World.wait(260);
        } else had.el.classList.add("in");
        return;
      }
      if (moving) {
        had.el.scrollIntoView({ block: "nearest" });
        await hand.to(had.el, "corner", 380);
        hand.tap();
        had.el.classList.remove("changed");
        void had.el.offsetWidth;
        had.el.classList.add("changed");
      }
      fill(had.el, one.t);
      await dots(had.el, one.t, moving);
    }
    function heard() {
      var want = wanted(), ids = want.map((w) => w.id), changed = 0, made = 0;
      Object.keys(shown).forEach((id) => {
        if (ids.indexOf(id) >= 0) return;
        var el = shown[id].el;
        delete shown[id];
        el.classList.add("out");
        if (World.moving) setTimeout(() => el.remove(), 400); else el.remove();
      });
      want.forEach((w, i) => {
        if (!shown[w.id]) { shown[w.id] = { el: build(w.id), was: null }; made++; }
        else if (shown[w.id].was !== JSON.stringify(w.t)) changed++;
        // Each stands where its order puts it
        if (room.children[i] !== shown[w.id].el) room.insertBefore(shown[w.id].el, room.children[i] || null);
      });
      room.setAttribute("data-n", String(want.length));
      none.hidden = want.length > 0;
      want.forEach((w) => { work = work.then(() => bring(w.id)).catch(() => {}); });
      var note = words((It.state || {}).note, 200);
      if (note) Tour.say("did", note);
      if (opened && (made || changed)) {
        Tour.answered(made ? "set down " + (made === 1 ? "a tile" : made + " tiles") : "changed " + (changed === 1 ? "a tile" : changed + " tiles"));
        World.sound.land();
      }
      if (Tour.arrived()) opened = true;
    }
    hand.move(innerWidth * 0.62, innerHeight * 0.42, 0);
    addEventListener("resize", () => { if (!Object.keys(shown).length) hand.move(innerWidth * 0.62, innerHeight * 0.42, 0); });
    It.onState(heard);
    heard();
  });
</script>
</body>
</html>
