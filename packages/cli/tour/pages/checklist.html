<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A checklist</title>
<style>
/*kit.css*/
  /* The list stands on the dark in large words. What the person ticks goes grey with a line
     through it, and what the agent adds is written in by its hand, with its green on the box. */
  .t-card { align-items: stretch; justify-content: center; gap: 18px; width: min(100%, 620px); }

  /* How far along it is: the count in words, and a thin line that fills */
  .meter { display: flex; flex-direction: column; gap: 9px; margin-top: 22px; max-width: 300px; }
  .track { height: 2px; background: var(--w-ghost); overflow: hidden; }
  .track i { display: block; width: 0; height: 100%; background: var(--w-fg); transition: width .4s var(--w-ease); }
  .count { font-family: var(--w-mono); font-size: 12.5px; color: var(--w-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* The list, which scrolls inside its part of the screen when it is longer than that */
  .pane { position: relative; flex: 0 1 auto; min-height: 98px; display: flex; }
  .pane::before, .pane::after {
    content: ""; position: absolute; left: 0; right: 0; z-index: 1; height: 26px; pointer-events: none; opacity: 0; transition: opacity .2s;
  }
  .pane::before { top: 0; background: linear-gradient(var(--w-bg), rgba(6, 6, 6, 0)); }
  .pane::after { bottom: 0; background: linear-gradient(rgba(6, 6, 6, 0), var(--w-bg)); }
  .pane[data-up="1"]::before, .pane[data-down="1"]::after { opacity: 1; }
  .list {
    position: relative; flex: 1; min-width: 0; min-height: 0; margin: 0; padding: 0; list-style: none;
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--w-ghost) transparent;
  }
  .row { display: block; }
  body.w .item {
    width: 100%; display: flex; align-items: flex-start; gap: 16px; padding: 9px 4px; text-align: left; touch-action: manipulation;
  }
  body.w .item:focus-visible { outline-offset: -2px; }
  .box {
    flex: none; width: 26px; height: 26px; margin-top: 3px; display: grid; place-items: center; border-radius: 8px;
    border: 2px solid #5a5a5a; transition: background .18s, border-color .18s, transform .12s;
  }
  @media (hover: hover) { .item:hover .box { border-color: var(--w-fg); } }
  .box svg { display: block; width: 16px; height: 16px; }
  .box path {
    fill: none; stroke: var(--w-bg); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 15; stroke-dashoffset: 15; transition: stroke-dashoffset .18s ease-out;
  }
  .item:active .box { transform: scale(.9); }
  /* Ticked: the box fills, the tick is drawn, and the words are struck through and stand back */
  .item[aria-checked="true"] .box, .item[aria-checked="true"]:hover .box { background: var(--w-fg); border-color: var(--w-fg); animation: pop .18s cubic-bezier(.3, 1.5, .5, 1); }
  .item[aria-checked="true"] .box path { stroke-dashoffset: 0; }
  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .words { flex: 1; min-width: 0; font-size: clamp(19px, 2.1vw, 27px); line-height: 1.22; font-weight: 600; letter-spacing: -.028em; overflow-wrap: anywhere; }
  .text {
    background: linear-gradient(var(--w-faint), var(--w-faint)) no-repeat 0 56% / 0 2px;
    transition: background-size .18s ease-out, color .18s;
  }
  .item[aria-checked="true"] .text { color: var(--w-faint); background-size: 100% 2px; }

  /* What the agent added: its box is green, ticked or not, its name comes after the words, and why it added it under them */
  .row[data-by="agent"] .box, .row[data-by="agent"] .item:hover .box { border-color: var(--w-ok); }
  .row[data-by="agent"] .item[aria-checked="true"] .box { background: var(--w-ok); }
  .who { margin-left: 12px; font-family: var(--w-mono); font-size: 11.5px; line-height: 16px; font-weight: 400; letter-spacing: 0; color: var(--w-ok); white-space: nowrap; vertical-align: .22em; }
  .why { display: block; margin-top: 4px; font-family: var(--w-mono); font-size: 12.5px; line-height: 18px; font-weight: 400; letter-spacing: 0; color: var(--w-muted); transition: opacity .4s; }
  .why:empty { display: none; }
  .item[aria-checked="true"] .why { color: var(--w-faint); }
  /* While the hand is writing one in, its name and its reason wait for the words */
  .row.writing .who, .row.writing .why { opacity: 0; }

  /* Coming, going, and being pointed at. One that comes opens from nothing to its own height and
     what is in it rises as it does, so that the list is never for a moment longer than it is */
  .row.in { overflow: hidden; transition: height .32s var(--w-ease); }
  .row.in .item { animation: rise .46s var(--w-ease) backwards; }
  .row.out { height: 0 !important; opacity: 0; overflow: hidden; transition: height .24s cubic-bezier(.4, 0, .2, 1), opacity .18s; }
  .row.nudge .item { animation: nudge .7s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes nudge { 0%, 100% { background-color: transparent; } 25% { background-color: var(--w-ghost); } }

  /* Adding one of your own */
  .add { display: flex; align-items: baseline; gap: 16px; padding: 0 4px; }
  .add input {
    flex: 1; min-width: 0; padding: 6px 0; border: 0; border-bottom: 2px solid var(--w-ghost); background: transparent; color: var(--w-fg);
    font: inherit; font-size: 17px; letter-spacing: -.01em; outline: none; user-select: text; -webkit-user-select: text; transition: border-color .15s;
  }
  .add input::placeholder { color: var(--w-faint); opacity: 1; }
  body.w .add input:focus { border-color: var(--w-ok); outline: 0; }

  @media (max-width: 820px) {
    .t-card { justify-content: flex-start; padding-top: 38px; gap: 12px; }
    .meter { margin-top: 12px; }
  }
  /* On a screen too short for all of it, the whole page scrolls and the list does not */
  @media (max-height: 560px) {
    .t-wrap { position: absolute; inset: 0 0 auto; min-height: 100%; }
    body.w { overflow-y: auto; }
    .pane { flex: none; }
    .list { overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track i, .box, .box path, .text, .item, .row.in, .row.out { transition: none; }
    .item[aria-checked="true"] .box, .row.in .item, .row.nudge .item { animation: none; }
  }
</style>
</head>
<body class="w">
  <div class="t-wrap">
    <div class="t-words">
      <h1 class="t-h" id="head">{{heading}}</h1>
      <p class="t-sub">{{sub}}</p>
      <div class="meter"><span class="count" id="count"></span><span class="track" aria-hidden="true"><i id="fill"></i></span></div>
      <div class="t-log" aria-live="polite">
        <p class="t-you" id="t-you"><span>you</span><b></b></p>
        <p class="t-did" id="t-did"><span></span><b></b></p>
      </div>
    </div>
    <div class="t-card">
      <div class="pane" id="pane"><ul class="list" id="list" aria-labelledby="head"></ul></div>
      <form class="add" id="add" autocomplete="off">
        <input id="new" type="text" maxlength="80" placeholder="Add something" aria-label="Add something" enterkeyhint="done">
        <button class="t-btn" id="put" type="submit" disabled>Add</button>
      </form>
    </div>
  </div>
<!--rail-->
<script>
/*kit.js*/
</script>
<script>
  // A list to tick off and add to. A moment after the person stops, the agent is told the whole
  // list. What the agent adds comes back in the page's state, as `added`, and is put on the same
  // list as the agent's own: its hand goes to the foot of the list and writes each one in.
  Tour.ready(() => {
    var It = Tour.It, P = Tour.P, agent = Tour.agent;
    var $ = (id) => document.getElementById(id);
    var list = $("list"), pane = $("pane"), form = $("add"), field = $("new"), put = $("put"), count = $("count"), fill = $("fill");
    var TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.5l3.2 3.2 6.4-7.2"/></svg>';
    var MOST = 60;      // as long as a list gets, so that telling the agent of it stays small
    var PAUSE = 1200;   // how long after the last tick or addition the agent is told
    var QUIET = 20000;  // how long the hand says that the agent has not answered: an agent need not add something every time
    var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

    var items = [], rows = {}, seq = 0;
    var ticked = {}, unticked = {}, mine = [];   // what the person has done since the agent was last told
    var telling = 0, quiet = 0, heard = null, lastNote = "", loaded = false;

    function tidy(text, most) {
      return typeof text === "string" || typeof text === "number" ? String(text).replace(/\s+/g, " ").trim().slice(0, most) : "";
    }
    var word = tidy(P.done_word, 24) || "packed";
    function find(text) {
      var k = text.toLowerCase();
      for (var i = 0; i < items.length; i++) if (items[i].text.toLowerCase() === k) return items[i];
      return null;
    }
    var things = (n) => n + (n === 1 ? " thing" : " things");
    var short = (text) => (text.length > 34 ? text.slice(0, 32).trim() + "…" : text);

    // One row: a checkbox that is the whole row, so that the words can be pressed as well as the box
    function row(item) {
      var li = document.createElement("li"), b = document.createElement("button");
      var box = document.createElement("span"), words = document.createElement("span"), text = document.createElement("span");
      li.className = "row"; li.setAttribute("data-by", item.by);
      b.type = "button"; b.className = "item"; b.setAttribute("role", "checkbox");
      box.className = "box"; box.innerHTML = TICK;
      words.className = "words"; text.className = "text"; text.textContent = item.text;
      words.appendChild(text);
      if (item.by === "agent") {
        var who = document.createElement("span"), why = document.createElement("span");
        who.className = "who"; who.textContent = agent;
        why.className = "why";
        words.appendChild(who); words.appendChild(why);
      }
      b.appendChild(box); b.appendChild(words); li.appendChild(b);
      b.addEventListener("click", () => toggle(item));
      return li;
    }
    // What of a row can change: whether it is ticked, and why the agent added it
    function dress(item) {
      var li = rows[item.id];
      if (!li) return;
      var b = li.firstChild;
      b.setAttribute("aria-checked", item.done ? "true" : "false");
      if (item.by !== "agent") return;
      li.querySelector(".why").textContent = item.why;
      b.setAttribute("aria-label", item.text + ", added by " + agent + (item.why ? ": " + item.why : ""));
    }
    function edges() {
      pane.setAttribute("data-up", list.scrollTop > 2 ? "1" : "0");
      pane.setAttribute("data-down", list.scrollTop + list.clientHeight < list.scrollHeight - 2 ? "1" : "0");
    }
    // Moves the list some part of the way to where a row is wholly in it
    function settle(li, part) {
      var high = li.offsetTop, low = Math.min(high, li.offsetTop + li.offsetHeight - list.clientHeight);
      var far = (list.scrollTop < low ? low : list.scrollTop > high ? high : list.scrollTop) - list.scrollTop;
      if (far) list.scrollTop += (far < 0 ? -1 : 1) * Math.min(Math.abs(far), Math.max(1, Math.abs(far) * part));
    }
    // Brings a row into sight and keeps it there while it opens, by scrolling the list and nothing outside it
    var seeing = null, until = 0;
    function reveal(li) {
      if (calm) { settle(li, 1); return; }
      var going = !!seeing;
      seeing = li;
      until = performance.now() + 700;
      if (going) return;
      requestAnimationFrame(function frame(now) {
        var last = now > until || !seeing.isConnected;
        if (seeing.isConnected) settle(seeing, last ? 1 : .24);
        if (last) { seeing = null; edges(); } else requestAnimationFrame(frame);
      });
    }
    function mount(item, sliding) {
      if (rows[item.id] || items.indexOf(item) < 0) return;
      var li = (rows[item.id] = row(item)), after = null;
      dress(item);
      // It goes where it is in the list: before the first one after it that is already shown
      for (var i = items.indexOf(item) + 1; i < items.length && !after; i++) after = rows[items[i].id] || null;
      list.insertBefore(li, after);
      if (sliding && !calm) {
        var tall = li.offsetHeight;
        li.style.height = "0px";
        li.classList.add("in");
        void li.offsetHeight;
        li.style.height = tall + "px";
        setTimeout(() => { li.classList.remove("in"); li.style.height = ""; edges(); }, 520);
      }
      if (sliding) reveal(li);
      edges();
    }
    function unmount(item) {
      var li = rows[item.id];
      delete rows[item.id];
      if (!li) return;
      li.style.height = li.offsetHeight + "px";
      void li.offsetHeight;
      li.firstChild.disabled = true;
      li.classList.add("out");
      setTimeout(() => { li.remove(); edges(); }, calm ? 0 : 280);
    }
    function tally() {
      var n = items.length, d = items.filter((i) => i.done).length;
      count.textContent = n ? d + " of " + n + " " + word : "Nothing on it yet";
      fill.style.width = n ? (100 * d) / n + "%" : "0";
      put.disabled = !field.value.trim() || n >= MOST;
    }

    // ── What the person does ──
    function toggle(item) {
      item.done = !item.done;
      dress(item);
      tally();
      // Ticking one and unticking it again is nothing done
      var into = item.done ? ticked : unticked, outOf = item.done ? unticked : ticked;
      if (outOf[item.id]) delete outOf[item.id]; else into[item.id] = 1;
      soon();
    }
    field.addEventListener("input", tally);
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      var text = tidy(field.value, 80);
      if (!text) return;
      var there = find(text);
      if (!there && items.length >= MOST) return;
      // The words are taken, and the place to write stays ready for the next ones, however Add was pressed
      field.value = "";
      field.focus();
      if (there) {
        // It is on the list already: the one that is there is pointed at, and nothing is added
        var li = rows[there.id];
        if (li) { reveal(li); li.classList.remove("nudge"); void li.offsetWidth; li.classList.add("nudge"); }
        tally();
        return;
      }
      var item = { id: ++seq, text: text, done: false, by: "you", why: "" };
      items.push(item);
      mine.push(text);
      mount(item, true);
      tally();
      soon();
    });
    function soon() {
      clearTimeout(telling);
      if (!Object.keys(ticked).length && !Object.keys(unticked).length && !mine.length) return;
      telling = setTimeout(tell, PAUSE);
    }
    // Tells the agent the whole list as it now is, and says under the card what was just done to it
    function tell() {
      var said = [], t = Object.keys(ticked).length, u = Object.keys(unticked).length, a = mine.length;
      if (t) said.push("ticked " + things(t));
      if (u) said.push("unticked " + things(u));
      if (a) said.push("added " + short(mine[0]) + (a > 1 ? " and " + (a - 1) + " more" : ""));
      var last = said.pop();
      Tour.say("you", said.length ? said.join(", ") + (a > 1 ? ", " : " and ") + last : last);
      ticked = {}; unticked = {}; mine = [];
      clearTimeout(quiet);
      quiet = setTimeout(() => Tour.quiet(""), QUIET);
      Tour.act("list", { items: items.map((i) => ({ text: i.text, done: i.done, by: i.by })) }).catch(() => clearTimeout(quiet));
    }

    // ── What the agent does ──
    // What the agent has added, as the state has it: each thing once, in words of a sensible length
    function wanted() {
      var given = (It.state || {}).added, out = [], had = {};
      (Array.isArray(given) ? given : []).forEach((one) => {
        var text = tidy(one && typeof one === "object" ? one.text : one, 80), k = text.toLowerCase();
        if (!text || had[k] || out.length >= 20) return;
        had[k] = 1;
        out.push({ text: text, why: tidy(one && one.why, 120) });
      });
      return out;
    }
    // One thing of the agent's, written in: its row opens, the hand goes to it, and the words come a letter at a time
    var writing = Promise.resolve();
    async function write(item) {
      if (items.indexOf(item) < 0) return;
      mount(item, true);
      var li = rows[item.id];
      if (!li) return;
      li.classList.add("writing");
      var text = li.querySelector(".text");
      text.textContent = "";
      await World.wait(120);
      await Tour.hand.to(li.querySelector(".box"), "beside", 360);
      Tour.hand.tap();
      World.sound.step();
      await World.type(text, item.text, 38);
      li.classList.remove("writing");
      await World.wait(180);
    }
    function hear() {
      var want = wanted(), note = tidy((It.state || {}).note, 160);
      var now = JSON.stringify([want, note]);
      clearTimeout(quiet);
      // Heard from, with nothing new said: the hand keeps the words it had, and all else stays
      if (now === heard) { Tour.quiet(); return; }
      heard = now;
      var fresh = [], gone = [], asked = {};
      want.forEach((one) => {
        var item = find(one.text);
        if (item) {
          // On the list already. Where it is the agent's own it stays, with why as it is now given
          if (item.by === "agent") { asked[item.id] = 1; item.stays = false; if (item.why !== one.why) { item.why = one.why; dress(item); } }
          return;
        }
        if (items.length >= MOST) return;
        item = { id: ++seq, text: one.text, done: false, by: "agent", why: one.why, stays: false };
        items.push(item);
        asked[item.id] = 1;
        fresh.push(item);
      });
      // What the agent no longer has in `added` goes again, unless the person has ticked it: then
      // it stays, and goes on staying whatever they do with it after
      items.slice().forEach((item) => {
        if (item.by !== "agent" || asked[item.id] || item.stays) return;
        if (item.done) { item.stays = true; return; }
        items.splice(items.indexOf(item), 1);
        gone.push(item);
        unmount(item);
      });
      // The hand writes them in one after another. What was there when the page opened is simply there
      fresh.forEach((item) => { if (loaded && !calm) writing = writing.then(() => write(item)); else mount(item, false); });
      tally();

      var told = note && note !== lastNote;
      lastNote = note;
      Tour.answered(fresh.length ? "added " + things(fresh.length) : "");
      if (told) Tour.say("did", note);
      else if (fresh.length) {
        var first = fresh[0], more = fresh.length - 1;
        Tour.say("did", "added " + short(first.text) + (first.why ? ", for " + first.why : "") + (more ? (first.why ? ", and " : " and ") + more + " more" : ""));
      } else if (gone.length) Tour.say("did", "took " + (gone.length === 1 ? short(gone[0].text) : things(gone.length)) + " off again");
    }

    // ── The list it starts with ──
    var given = P.items;
    if (typeof given === "string") { try { given = JSON.parse(given); } catch (e) { given = given.split(/\n|,/); } }
    if (!Array.isArray(given)) given = ["Passport", "Phone charger", "Toothbrush", "Rain jacket", "Book for the train"];
    given.forEach((one) => {
      var text = tidy(one, 80);
      if (text && !find(text) && items.length < 40) items.push({ id: ++seq, text: text, done: false, by: "you", why: "" });
    });
    items.forEach((item) => mount(item, false));
    list.addEventListener("scroll", edges, { passive: true });
    window.addEventListener("resize", edges);
    if (window.ResizeObserver) new ResizeObserver(edges).observe(list);
    Tour.home(pane, 0);
    addEventListener("resize", () => { if (!items.some((i) => i.by === "agent")) Tour.home(pane, 0); });
    It.onState(hear);
    hear();
    // What is in the state as the page opens was added before this showing, and what comes after is the agent answering now
    if (Tour.arrived()) loaded = true; else It.onState(() => { loaded = true; });
    edges();
  });
</script>
</body>
</html>
