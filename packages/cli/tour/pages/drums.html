<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A drum machine</title>
<style>
/*kit.css*/
  :root { --gap: 8px; }
  .t-card { align-items: stretch; justify-content: center; gap: 22px; }
  .bpm { margin-top: 16px; font-family: var(--w-mono); font-size: 12px; letter-spacing: .04em; color: var(--w-faint); }

  /* Four drums down, eight steps across, the steps in two fours, and the name of each drum before its row */
  .deck { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; width: min(100%, max(320px, calc((100vh - 330px) * 2.1))); margin: 0 auto; }
  .names { display: grid; grid-template-rows: repeat(4, 1fr); gap: var(--gap); font-family: var(--w-mono); font-size: 11.5px; color: var(--w-faint); }
  .names span { display: flex; align-items: center; }
  .pads {
    display: grid; gap: var(--gap); user-select: none; -webkit-user-select: none;
    grid-template-columns: repeat(4, minmax(0, 1fr)) calc(var(--gap) * .5) repeat(4, minmax(0, 1fr));
  }
  /* A pad nobody plays is a dark square. The person's hits are white, and the agent's are its green */
  body.w .pad {
    position: relative; min-width: 0; aspect-ratio: 1; border-radius: 10px; background: #191919; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07);
    touch-action: manipulation;
    transition: background-color .14s, transform .12s cubic-bezier(.3, .7, .4, 1), box-shadow .16s;
  }
  /* The four beats of the bar stand out a little from the steps between them */
  body.w .pad[data-c="0"], body.w .pad[data-c="2"], body.w .pad[data-c="4"], body.w .pad[data-c="6"] { background: #232323; }
  body.w .pad.mine { background: #ffffff; }
  body.w .pad.theirs:not(.mine) { background: var(--w-ok); }
  @media (hover: hover) { .pad:hover:not(.on) { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .4); } }
  .pad:active { transform: scale(.94); }
  body.w .pad:focus-visible { outline-offset: 2px; border-radius: 10px; }
  /* The step being played: a line of light round its four pads, and a pad that sounds jumps */
  .pad.now { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .55); }
  .pad.now.on { transform: scale(1.07); box-shadow: 0 0 22px 2px rgba(255, 255, 255, .45); }
  .pad.now.theirs:not(.mine) { box-shadow: 0 0 24px 3px rgba(52, 211, 153, .6); }
  /* A hit of the agent's on a pad the person plays too: the pad stays white, with a green dot in its corner. They land one after another. */
  .pad.theirs { animation: land .5s var(--w-ease) backwards; animation-delay: var(--d, 0ms); }
  .pad.theirs.mine::after {
    content: ""; position: absolute; top: clamp(5px, 13%, 9px); right: clamp(5px, 13%, 9px);
    width: clamp(8px, 19%, 12px); aspect-ratio: 1; border-radius: 50%;
    background: var(--w-ok); box-shadow: 0 0 0 2.5px #fff;
  }
  @keyframes land { from { background-color: #191919; transform: scale(.82); } 55% { transform: scale(1.1); } }

  .foot { display: flex; align-items: baseline; gap: 22px; min-height: 36px; flex-wrap: wrap; }
  .foot [hidden] { display: none; }
  .play { flex: none; display: inline-flex; align-items: center; gap: 9px; min-width: 76px; }
  .play i { flex: none; width: 11px; height: 12px; background: currentColor; clip-path: polygon(8% 0, 100% 50%, 8% 100%); }
  .play[data-on="1"] i { height: 11px; clip-path: inset(0 round 2px); }
  .hint, .key { flex: 1; min-width: 0; margin: 0; font-family: var(--w-mono); font-size: 12px; line-height: 1.35; color: var(--w-faint); }
  .key { display: flex; align-items: center; gap: 8px; color: var(--w-muted); }
  .key i { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--w-ok); }
  .key span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media (max-width: 820px) {
    :root { --gap: 5px; }
    .t-card { justify-content: flex-start; padding-top: 44px; gap: 16px; }
    .deck { gap: 8px; width: 100%; }
    .names { font-size: 10px; }
    .pad { aspect-ratio: 1 / 1.75; border-radius: 8px; }
    .foot { gap: 12px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pad, .pad.theirs { transition: none; animation: none; }
    .pad.now.on, .pad:active { transform: none; }
  }
</style>
</head>
<body class="w">
  <div class="t-wrap">
    <div class="t-words">
      <h1 class="t-h">{{heading}}</h1>
      <p class="bpm">118 BPM · one bar of eight steps</p>
      <div class="t-log" aria-live="polite">
        <p class="t-you" id="t-you"><span>you</span><b></b></p>
        <p class="t-did" id="t-did"><span></span><b></b></p>
      </div>
    </div>
    <div class="t-card">
      <div class="deck" id="deck">
        <div class="names" aria-hidden="true"><span>hat</span><span>clap</span><span>snare</span><span>kick</span></div>
        <div class="pads" id="pads" role="group" aria-label="Four drums, eight steps each"></div>
      </div>
      <div class="foot">
        <button class="t-btn play" id="play" type="button" data-on="0"><i aria-hidden="true"></i><span>Play</span></button>
        <p class="hint" id="hint">Each row is a drum. Tap to add a hit.</p>
        <p class="key" id="key" hidden><i aria-hidden="true"></i><span></span></p>
        <button class="t-btn quiet" id="clear" type="button" disabled>Clear</button>
      </div>
    </div>
  </div>
<!--rail-->
<script>
/*kit.js*/
</script>
<script>
  // A drum machine. The person taps hits onto the pads. A moment after they stop, the page
  // tells the agent the beat, and the agent answers with hits of its own, in `theirs`. Those
  // are shown on the same pads in green, and are played in the same loop: for the first two
  // bars the agent's hand taps each of its hits as it is played.
  Tour.ready(() => {
    var It = Tour.It, $ = (id) => document.getElementById(id);
    var ROWS = ["hat", "clap", "snare", "kick"], NAMES = ["Hat", "Clap", "Snare", "Kick"];
    // Eight steps are two beats, four steps to the beat
    var STEPS = 8, BPM = 118, STEP = 60 / BPM / 2;
    var padsEl = $("pads"), playBtn = $("play"), clearBtn = $("clear"), hint = $("hint"), key = $("key");
    var blank = () => ROWS.map(() => { var row = []; for (var c = 0; c < STEPS; c++) row.push(false); return row; });
    var count = (g) => g.reduce((n, row) => n + row.filter(Boolean).length, 0);
    var mine = blank(), theirs = blank(), ignoreReplies = false, request = null;
    var taken = null, noteWas = "", asked = false, waiting = false, sentAt = 0, sentKey = null, sendTimer = 0, quietTimer = 0;
    // How many times the state has been set, where It says
    var turn = () => (typeof It.revision === "number" ? It.revision : 0);
    // How much has been played so far, kept where it can be counted
    var meter = (window.__drums = { audio: "none", steps: 0, notes: 0 });

    // ── The sound: every drum is made here, from a tone or from noise ──
    var AC = window.AudioContext || window.webkitAudioContext, ctx = null, out = null, hiss = null;
    // The browser lets sound start only from a tap, so this is called from every one
    function audio() {
      if (!AC) return null;
      if (!ctx) {
        try {
          ctx = new AC();
          // Every drum at once is held under the top, so that nothing is ever cut off
          var squeeze = ctx.createDynamicsCompressor(), trim = ctx.createGain();
          out = ctx.createGain();
          out.gain.value = World.sound.off() ? 0 : .8;
          trim.gain.value = .8;
          out.connect(squeeze);
          squeeze.connect(trim);
          trim.connect(ctx.destination);
          hiss = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
          var d = hiss.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          meter.audio = ctx.state;
          ctx.onstatechange = () => { meter.audio = ctx.state; };
        } catch (e) {
          ctx = null; AC = null;
          return null;
        }
      }
      if (ctx.state !== "running" && ctx.resume) {
        try { var p = ctx.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
      }
      return ctx;
    }
    // A tone that may fall from one pitch to another, and dies away
    function tone(t, to, shape, from, down, fall, peak, len) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = shape;
      o.frequency.setValueAtTime(from, t);
      if (down !== from) o.frequency.exponentialRampToValueAtTime(down, t + fall);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + .004);
      g.gain.exponentialRampToValueAtTime(.0001, t + len);
      o.connect(g); g.connect(to);
      o.start(t); o.stop(t + len + .02);
    }
    // A burst of noise through a filter, dying away
    function burst(t, to, kind, freq, q, peak, len) {
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = hiss;
      f.type = kind; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(peak, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + len);
      s.connect(f); f.connect(g); g.connect(to);
      s.start(t, Math.random() * .6, len + .03);
    }
    var VOICE = [
      // Hat: a tick of the highest noise
      (t, to) => burst(t, to, "highpass", 7500, .7, .34, .05),
      // Clap: three bursts a few thousandths of a second apart, the last one ringing
      (t, to) => {
        burst(t, to, "bandpass", 1200, 1.1, 1.5, .02);
        burst(t + .011, to, "bandpass", 1200, 1.1, 1.5, .02);
        burst(t + .022, to, "bandpass", 1200, 1.1, 1.7, .17);
      },
      // Snare: noise, and a short tone under it
      (t, to) => { burst(t, to, "highpass", 1400, .6, .55, .17); tone(t, to, "triangle", 180, 180, 0, .5, .11); },
      // Kick: a sine that falls fast, with a tick at its start for speakers too small for the rest
      (t, to) => { tone(t, to, "sine", 150, 45, .11, 1, .34); burst(t, to, "lowpass", 1800, .7, .22, .012); },
    ];

    // ── The loop: steps are given their times a little ahead, on the sound's own clock ──
    var playing = false, live = false, timer = 0, frame = 0, step = 0, at = 0, due = [], bus = null, lit = -1;
    // The sound's clock where there is sound, and the page's where there is none
    var clock = () => (live ? ctx.currentTime : performance.now() / 1000);
    function line() {
      if (!bus) { bus = ctx.createGain(); bus.connect(out); }
      return bus;
    }
    function ahead() {
      var on = !!(ctx && ctx.state === "running");
      // Sound has come or gone: the loop goes on by the other clock, from the first step not yet played
      if (on !== live) {
        if (!on && bus) { try { bus.disconnect(); } catch (e) {} bus = null; }
        step = (step - (due.length % STEPS) + STEPS) % STEPS;
        live = on; at = clock() + .05; due = [];
      }
      var now = clock();
      // Fallen behind, as in a tab nobody is looking at: what was missed is left out, and the place is kept
      if (at < now - .03) {
        var missed = Math.ceil((now - at) / STEP);
        step = (step + missed) % STEPS;
        at += missed * STEP;
      }
      var far = document.hidden ? 1.25 : .12;
      while (at < now + far) {
        if (live) for (var r = 0; r < ROWS.length; r++) if (mine[r][step] || theirs[r][step]) { VOICE[r](at, line()); meter.notes++; }
        due.push({ step: step, at: at });
        meter.steps++;
        step = (step + 1) % STEPS;
        at += STEP;
      }
      if (due.length > 16) due.splice(0, due.length - 16);
    }
    // The light follows what is heard
    function show() {
      var now = clock() - (live ? Math.min(ctx.outputLatency || 0, .25) : 0), cur = -1;
      while (due.length && due[0].at <= now) cur = due.shift().step;
      if (cur >= 0) light(cur);
      frame = requestAnimationFrame(show);
    }
    function light(c) {
      if (c === lit) return;
      if (lit >= 0) pad.forEach((row) => row[lit].classList.remove("now"));
      lit = c;
      if (c >= 0) pad.forEach((row) => row[c].classList.add("now"));
      padsEl.setAttribute("data-step", c);
      if (c >= 0) beat(c);
      if (c >= 0 && follow > 0) { follow--; drum(c); }
    }
    // Every hit that is played sends a wave through the field from its pad, the agent's in green: the kick the largest, the hat the least
    var WAVE = [0.3, 0.55, 0.7, 1.1];
    function beat(c) {
      for (var r = 0; r < ROWS.length; r++) {
        if (!mine[r][c] && !theirs[r][c]) continue;
        var at = pad[r][c].getBoundingClientRect();
        World.wave(at.left + at.width / 2, at.top + at.height / 2, WAVE[r], theirs[r][c] && !mine[r][c], 1000);
      }
    }
    // The agent's hand at the drums. It taps the hit of its own that is being played, and goes on to the next of them
    var follow = 0;
    var hit = (c) => { for (var r = 0; r < ROWS.length; r++) if (theirs[r][c]) return pad[r][c]; return null; };
    function reach(c) {
      for (var n = 1; n <= STEPS; n++) {
        var to = hit((c + n) % STEPS);
        if (to) return Tour.hand.to(to, "middle", Math.min(260, n * STEP * 800));
      }
    }
    function drum(c) {
      if (hit(c)) Tour.hand.tap();
      if (follow > 0) reach(c);
    }
    // The world's own switch turns these drums off and on with everything else
    World.sound.onToggle((quiet) => { if (out) out.gain.value = quiet ? 0 : .8; });
    function start() {
      if (playing) return;
      playing = true;
      live = !!(ctx && ctx.state === "running");
      step = 0; at = clock() + .06; due = [];
      timer = setInterval(ahead, 25);
      ahead();
      frame = requestAnimationFrame(show);
      paint();
    }
    function stop() {
      if (!playing) return;
      playing = false;
      clearInterval(timer);
      cancelAnimationFrame(frame);
      // What was already given a time is not heard
      if (bus) {
        var b = bus;
        bus = null;
        try { b.gain.setTargetAtTime(0, ctx.currentTime, .008); } catch (e) {}
        setTimeout(() => { try { b.disconnect(); } catch (e) {} }, 400);
      }
      due = [];
      light(-1);
      paint();
    }

    // A page that is looked at again takes its sound up again, and one that is left is given its steps further ahead
    document.addEventListener("visibilitychange", () => {
      if (!playing) return;
      if (!document.hidden) audio();
      ahead();
    });

    // ── The pads ──
    var pad = ROWS.map((name, r) => {
      var row = [];
      for (var c = 0; c < STEPS; c++) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "pad";
        b.setAttribute("data-r", r);
        b.setAttribute("data-c", c);
        b.style.gridRow = String(r + 1);
        b.style.gridColumn = String(c < 4 ? c + 1 : c + 2);
        padsEl.appendChild(b);
        row.push(b);
      }
      return row;
    });
    key.querySelector("span").textContent = Tour.agent + "’s hits";
    function paint() {
      var any = count(theirs) > 0;
      pad.forEach((row, r) => row.forEach((b, c) => {
        var m = mine[r][c], t = theirs[r][c];
        b.classList.toggle("on", m || t);
        b.classList.toggle("mine", m);
        b.classList.toggle("theirs", t);
        b.setAttribute("aria-pressed", m ? "true" : "false");
        b.setAttribute("aria-label", NAMES[r] + ", step " + (c + 1) + (t ? ", " + Tour.agent + " plays here" : ""));
      }));
      hint.hidden = any;
      key.hidden = !any;
      clearBtn.disabled = !any && !count(mine) && !playing;
      playBtn.setAttribute("data-on", playing ? "1" : "0");
      playBtn.querySelector("span").textContent = playing ? "Stop" : "Play";
    }
    function tap(r, c) {
      var a = audio();
      mine[r][c] = !mine[r][c];
      // Replies to the previous beat stop applying as soon as a pad changes.
      ignoreReplies = true; request = null;
      if (mine[r][c] && a) VOICE[r](a.currentTime, out);
      paint();
      // The beat goes to the agent once the person has left it alone for a moment, however few hits are in it
      clearTimeout(sendTimer);
      sendTimer = setTimeout(send, 1500);
    }
    padsEl.addEventListener("click", (e) => {
      var b = e.target.closest(".pad");
      if (b) tap(+b.getAttribute("data-r"), +b.getAttribute("data-c"));
    });
    // The arrow keys go from pad to pad
    padsEl.addEventListener("keydown", (e) => {
      var b = e.target.closest(".pad"), d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
      if (!b || !d) return;
      var r = +b.getAttribute("data-r") + d[0], c = +b.getAttribute("data-c") + d[1];
      if (r < 0 || r >= ROWS.length || c < 0 || c >= STEPS) return;
      e.preventDefault();
      pad[r][c].focus();
    });
    playBtn.addEventListener("click", () => {
      audio();
      if (playing) stop(); else start();
    });
    clearBtn.addEventListener("click", () => {
      clearTimeout(sendTimer);
      clearTimeout(quietTimer);
      // The agent's hits go from the pads with the person's own, and stay gone until it plays others
      mine = blank(); theirs = blank(); ignoreReplies = true; request = null;
      sentKey = null; asked = false; waiting = false; follow = 0;
      stop();
      paint();
      Tour.say("you", "cleared the pads");
      Tour.say("did", "");
      Tour.act("cleared", {}).then(() => Tour.quiet(""), () => {});
    });

    // ── What goes to the agent, and what comes back ──
    function send() {
      var n = count(mine), pattern = mine.map((row) => row.map((on) => (on ? "x" : ".")).join("")), k = pattern.join("/");
      // An edit that restores the same beat still needs a fresh request for its answer.
      if (k === sentKey && (!n || request)) return;
      // With the last hit taken off there is no beat to play between. An agent that was told of
      // one is told that the pads are empty, as the button that empties them tells it
      if (!n) {
        if (sentKey === null) return;
        sentKey = k; waiting = false; asked = false; ignoreReplies = true; request = null; follow = 0;
        clearTimeout(quietTimer);
        theirs = blank();
        stop();
        paint();
        Tour.say("you", "took the last hit off");
        Tour.say("did", "");
        Tour.act("cleared", {}).then(() => Tour.quiet(""), () => { if (sentKey === k) sentKey = null; });
        return;
      }
      sentKey = k; asked = true; waiting = true; ignoreReplies = false; sentAt = turn();
      request = Array.from(crypto.getRandomValues(new Uint8Array(16)), (n) => n.toString(16).padStart(2, "0")).join("");
      var sentRequest = request;
      Tour.say("you", "put down " + n + (n === 1 ? " hit" : " hits"));
      clearTimeout(quietTimer);
      // An agent that has not answered in a minute is said no more to be awaited
      quietTimer = setTimeout(() => Tour.quiet(count(theirs) ? "played between yours" : ""), 60000);
      Tour.act("beat", { request: sentRequest, bpm: BPM, rows: ROWS.slice(), pattern: pattern }).catch(() => {
        if (request !== sentRequest) return;
        clearTimeout(quietTimer);
        sentKey = null; request = null;
      });
    }
    // The agent's hits: four rows of eight, an `x` where it plays. None at all is no hits, and anything else is not taken.
    function read(v) {
      if (typeof v === "string" && v.charAt(0) === "[") { try { v = JSON.parse(v); } catch (e) { return null; } }
      if (v == null || v === "" || (Array.isArray(v) && !v.length)) return blank();
      if (!Array.isArray(v) || v.length !== ROWS.length) return null;
      var g = [];
      for (var r = 0; r < v.length; r++) {
        if (typeof v[r] !== "string" || v[r].length !== STEPS) return null;
        g.push(v[r].split("").map((ch) => ch === "x" || ch === "X"));
      }
      return g;
    }
    function hear() {
      var st = It.state || {}, k = taken, fresh = false;
      try { k = JSON.stringify(st.theirs === undefined ? null : st.theirs); } catch (e) {}
      // A reply to a beat that was edited or cleared cannot put its hits or note back.
      if (ignoreReplies) { taken = k; return; }
      // Pattern and note arrive together with the id of the beat they answer.
      var reply = st.theirs;
      if (request && (!reply || reply.request !== request)) return;
      var pattern = request ? reply.pattern : reply;
      if (k !== taken) {
        var got = read(pattern);
        if (got) {
          taken = k; theirs = got; fresh = count(got) > 0;
          // They land in the order they are played
          for (var c = 0, i = 0; c < STEPS; c++) for (var r = 0; r < ROWS.length; r++) if (got[r][c]) pad[r][c].style.setProperty("--d", i++ * 70 + "ms");
        }
      }
      // A matching reply may repeat the same hits as the previous beat.
      else if (waiting && turn() > sentAt) {
        var same = read(pattern);
        if (same && count(same) > 0) { theirs = same; fresh = true; }
      }
      var text = request ? reply.note : st.note;
      var note = typeof text === "string" ? text.trim().slice(0, 160) : "";
      var said = !!note && note !== noteWas;
      noteWas = note;
      paint();
      if (fresh) {
        var added = 0;
        waiting = false;
        theirs.forEach((row, r) => row.forEach((on, c) => { if (on && !mine[r][c]) added++; }));
        Tour.answered("played between yours");
        World.sound.land();
        if (!said) Tour.say("did", added ? "added " + added + (added === 1 ? " hit" : " hits") + " between yours" : "played the same hits as you");
        // It is an answer to a beat the person sent, so it is heard at once
        if (asked && !playing) { audio(); start(); }
        // The hand goes to the first of its hits, and taps them as they are played for two bars
        follow = playing ? STEPS * 2 : 0;
        reach(STEPS - 1);
      }
      if (said) {
        Tour.say("did", note);
        if (!fresh) Tour.answered(count(theirs) ? "played between yours" : "");
      }
      if (fresh || said) clearTimeout(quietTimer);
    }
    Tour.home($("deck"), 0);
    addEventListener("resize", () => { if (!count(theirs)) Tour.home($("deck"), 0); });
    It.onState(hear);
    hear();
  });
</script>
</body>
</html>
